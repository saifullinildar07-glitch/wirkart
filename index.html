<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWIN BOL - Casino Core</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%;
            background: #09090b; color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .app-container {
            width: 100%; height: 100vh; max-width: 480px;
            padding: 12px; background: #0f0f12;
            display: flex; flex-direction: column; gap: 10px;
            position: relative; margin: 0 auto;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: #16161a;
            border-radius: 14px; border: 1px solid #27272a; flex-shrink: 0;
        }
        .brand {
            font-size: 16px; font-weight: 900; color: #f5b342;
            letter-spacing: 1px; text-transform: uppercase;
        }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .balance-box {
            background: #222228; padding: 4px 12px; border-radius: 10px;
            border: 1px solid #3f3f46; cursor: pointer; text-align: right;
            transition: transform 0.1s, border-color 0.2s;
            will-change: transform;
        }
        .balance-box:active { transform: scale(0.96); }
        .balance-label { font-size: 9px; color: #a1a1aa; text-transform: uppercase; }
        .balance-amount { font-size: 15px; font-weight: 700; color: #f5b342; }

        .burger-btn {
            background: transparent; border: none; cursor: pointer;
            display: flex; flex-direction: column; gap: 4px; padding: 6px;
        }
        .burger-btn span {
            display: block; width: 20px; height: 2px; background: #fff; border-radius: 2px;
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .body-layout { display: flex; gap: 10px; flex: 1; min-height: 0; }
        .sidebar {
            width: 80px; background: #16161a; border-radius: 14px;
            padding: 8px 4px; border: 1px solid #27272a;
            display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
        }
        .menu-btn {
            font-size: 10px; font-weight: 700; color: #a1a1aa; padding: 10px 4px;
            border-radius: 8px; cursor: pointer; text-align: center;
            border: 1px solid #27272a; background: #1c1c21;
            text-transform: uppercase; transition: background 0.2s, color 0.2s;
        }
        .menu-btn.active, .menu-btn:hover { background: #f5b342; color: #000; border-color: #f5b342; }

        .viewport {
            flex: 1; background: #16161a; border-radius: 14px;
            border: 1px solid #27272a; position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* ===== PLINKO GAME UI ===== */
        .plinko-screen {
            display: flex; flex-direction: column; width: 100%; height: 100%; padding: 10px; gap: 8px;
        }
        .canvas-wrapper {
            flex: 1; width: 100%; min-height: 0; background: #0d0d11;
            border-radius: 10px; position: relative; border: 1px solid #222228;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .controls-panel {
            background: #1c1c21; padding: 8px; border-radius: 10px;
            display: flex; flex-direction: column; gap: 8px; border: 1px solid #27272a;
        }
        .control-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
        .bet-input-wrap { display: flex; align-items: center; gap: 6px; background: #0d0d11; padding: 4px 8px; border-radius: 6px; }
        .bet-input-wrap label { font-size: 11px; color: #a1a1aa; }
        .bet-input-wrap input {
            width: 60px; background: transparent; border: none; color: #fff;
            font-weight: 700; text-align: right; outline: none;
        }
        .btn-play {
            flex: 1; background: #f5b342; color: #000; border: none;
            padding: 10px; border-radius: 8px; font-weight: 800;
            font-size: 14px; cursor: pointer; text-transform: uppercase;
            transition: opacity 0.2s, transform 0.1s;
            will-change: transform;
        }
        .btn-play:active { transform: scale(0.97); }

        /* ===== МОДАЛКИ И ШТОРКИ ===== */
        .backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 100;
        }
        .backdrop.visible { opacity: 1; pointer-events: auto; }

        .drawer {
            position: fixed; bottom: 0; left: 50%; transform: translate(-50%, 100%);
            width: 100%; max-width: 480px; background: #16161a;
            border-radius: 20px 20px 0 0; padding: 20px; border-top: 1px solid #3f3f46;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 101;
            will-change: transform;
        }
        .drawer.open { transform: translate(-50%, 0); }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .drawer-title { font-size: 16px; font-weight: 700; color: #aaa; }
        .btn-close { background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="brand">TWIN BOL</div>
        <div class="header-right">
            <div class="balance-box" id="balanceBtn">
                <div class="balance-label">Баланс</div>
                <div class="balance-amount">$<span id="balanceDisplay">1000.00</span></div>
            </div>
            <button class="burger-btn" id="burgerBtn" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <div class="body-layout">
        <aside class="sidebar">
            <button class="menu-btn active" data-game="plinko">Plinko</button>
            <button class="menu-btn" data-game="slots">Slots</button>
            <button class="menu-btn" data-game="mines">Mines</button>
        </aside>

        <main class="viewport" id="viewport">
            <div class="plinko-screen">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="plinkoCanvas"></canvas>
                </div>
                <div class="controls-panel">
                    <div class="control-row">
                        <div class="bet-input-wrap">
                            <label for="betAmount">Ставка:</label>
                            <input type="number" id="betAmount" value="10" min="1" step="1">
                        </div>
                        <button class="btn-play" id="dropBallBtn">Запуск</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="drawer" id="balanceDrawer">
    <div class="drawer-header">
        <span class="drawer-title">Управление балансом</span>
        <button class="btn-close" id="closeDrawerBtn">✕</button>
    </div>
    <p style="margin-bottom: 15px; color: #888; font-size: 14px;">Тестовый пополняемый счет:</p>
    <button class="btn-play" id="addFundsBtn" style="width: 100%;">Пополнить на $500</button>
</div>

<script>
// ================================================================
// 1. STATE MANAGEMENT (Управление состоянием)
// ================================================================
class StateManager {
    constructor(initialBalance = 1000) {
        this.balance = initialBalance;
        this.listeners = [];
    }
    subscribe(listener) { this.listeners.push(listener); }
    notify() { this.listeners.forEach(fn => fn(this.balance)); }
    
    add(amount) {
        this.balance += amount;
        this.notify();
    }
    sub(amount) {
        if (this.balance >= amount) {
            this.balance -= amount;
            this.notify();
            return true;
        }
        return false;
    }
}
const AppState = new StateManager(1000);

// ================================================================
// 2. PLINKO PHYSICS ENGINE (Физический движок 60 FPS Canvas)
// ================================================================
class PlinkoEngine {
    constructor(canvas, wrapper) {
        this.canvas = canvas;
        this.wrapper = wrapper;
        this.ctx = canvas.getContext('2d');
        
        this.rows = 8;
        this.pegs = [];
        this.balls = [];
        this.slots = [5, 2, 0.5, 0.2, 0.5, 2, 5]; // Множители
        
        this.initResizing();
        this.buildBoard();
        this.loop = this.loop.bind(this);
        requestAnimationFrame(this.loop);
    }

    initResizing() {
        const resize = () => {
            this.width = this.canvas.width = this.wrapper.clientWidth;
            this.height = this.canvas.height = this.wrapper.clientHeight;
            this.buildBoard();
        };
        window.addEventListener('resize', resize);
        resize();
    }

    buildBoard() {
        this.pegs = [];
        const spacingX = this.width / (this.rows + 2);
        const spacingY = (this.height - 60) / this.rows;

        for (let r = 0; r < this.rows; r++) {
            const count = r + 3;
            const startX = (this.width - (count - 1) * spacingX) / 2;
            const y = 40 + r * spacingY;

            for (let c = 0; c < count; c++) {
                this.pegs.push({ x: startX + c * spacingX, y: y, r: 4 });
            }
        }
    }

    dropBall(onFinish) {
        const startX = this.width / 2 + (Math.random() * 4 - 2);
        this.balls.push({
            x: startX,
            y: 15,
            vx: (Math.random() - 0.5) * 1.5,
            vy: 1,
            r: 6,
            onFinish
        });
    }

    update() {
        const gravity = 0.2;
        const bounce = 0.5;

        for (let i = this.balls.length - 1; i >= 0; i--) {
            let b = this.balls[i];
            b.vy += gravity;
            b.x += b.vx;
            b.y += b.vy;

            // Столкновения с колышками
            for (let p of this.pegs) {
                let dx = b.x - p.x;
                let dy = b.y - p.y;
                let dist = Math.hypot(dx, dy);
                if (dist < b.r + p.r) {
                    let angle = Math.atan2(dy, dx);
                    let speed = Math.hypot(b.vx, b.vy) * bounce;
                    b.vx = Math.cos(angle) * speed + (Math.random() - 0.5) * 0.5;
                    b.vy = Math.sin(angle) * speed;
                    b.x = p.x + Math.cos(angle) * (b.r + p.r);
                    b.y = p.y + Math.sin(angle) * (b.r + p.r);
                }
            }

            // Достижение дна (слотов)
            if (b.y >= this.height - 30) {
                const slotWidth = this.width / this.slots.length;
                let slotIdx = Math.floor(b.x / slotWidth);
                slotIdx = Math.max(0, Math.min(this.slots.length - 1, slotIdx));
                
                b.onFinish(this.slots[slotIdx]);
                this.balls.splice(i, 1);
            }
        }
    }

    draw() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        // Отрисовка колышков
        this.ctx.fillStyle = '#f5b342';
        for (let p of this.pegs) {
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            this.ctx.fill();
        }

        // Отрисовка шаров
        this.ctx.fillStyle = '#ef4444';
        for (let b of this.balls) {
            this.ctx.beginPath();
            this.ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            this.ctx.fill();
        }

        // Отрисовка слотов множителей
        const slotWidth = this.width / this.slots.length;
        this.ctx.font = 'bold 11px system-ui';
        this.ctx.textAlign = 'center';
        for (let i = 0; i < this.slots.length; i++) {
            this.ctx.fillStyle = '#222228';
            this.ctx.fillRect(i * slotWidth + 2, this.height - 24, slotWidth - 4, 20);
            this.ctx.fillStyle = '#a1a1aa';
            this.ctx.fillText(`x${this.slots[i]}`, i * slotWidth + slotWidth / 2, this.height - 10);
        }
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(this.loop);
    }
}

// ================================================================
// 3. UI CONTROLLER (Связка интерфейса и событий)
// ================================================================
document.addEventListener('DOMContentLoaded', () => {
    // Подписка UI на изменение состояния
    const balanceDisplay = document.getElementById('balanceDisplay');
    AppState.subscribe(newBalance => {
        balanceDisplay.textContent = newBalance.toFixed(2);
    });

    // Модальное окно баланса
    const drawer = document.getElementById('balanceDrawer');
    const backdrop = document.getElementById('backdrop');
    const toggleDrawer = (open) => {
        drawer.classList.toggle('open', open);
        backdrop.classList.toggle('visible', open);
    };
    
    document.getElementById('balanceBtn').onclick = () => toggleDrawer(true);
    document.getElementById('closeDrawerBtn').onclick = () => toggleDrawer(false);
    backdrop.onclick = () => toggleDrawer(false);

    document.getElementById('addFundsBtn').onclick = () => {
        AppState.add(500);
        toggleDrawer(false);
    };

    // Инициализация Plinko
    const canvas = document.getElementById('plinkoCanvas');
    const wrapper = document.getElementById('canvasWrapper');
    const plinko = new PlinkoEngine(canvas, wrapper);

    // Запуск игры
    const dropBtn = document.getElementById('dropBallBtn');
    dropBtn.onclick = () => {
        const betInput = document.getElementById('betAmount');
        const bet = parseFloat(betInput.value) || 0;

        if (bet <= 0) return alert('Введите корректную ставку');
        if (!AppState.sub(bet)) return alert('Недостаточно средств!');

        plinko.dropBall((multiplier) => {
            const win = bet * multiplier;
            if (win > 0) AppState.add(win);
        });
    };
});
</script>
</body>
</html>
