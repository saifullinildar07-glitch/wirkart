<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWIN BOL</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            height: 100vh;
            max-width: 480px;
            padding: 12px 16px;
            background: #111;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-radius: 0;
            border: none;
            position: relative;
            margin: 0 auto;
        }
        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .brand {
            background: #6a1b9a;
            padding: 4px 14px;
            border-radius: 12px;
            border: 2px solid #f5b342;
            box-shadow: 0 0 15px rgba(245, 179, 66, 0.2);
            font-size: 18px;
            font-weight: 900;
            color: #f5b342;
            letter-spacing: 1px;
            text-transform: uppercase;
            user-select: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .brand:hover {
            box-shadow: 0 0 25px rgba(245, 179, 66, 0.5);
        }
        .auth-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .auth-buttons button {
            background: transparent;
            border: 1px solid #555;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #eee;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .auth-buttons button:hover {
            border-color: #f5b342;
            color: #f5b342;
            box-shadow: 0 0 12px rgba(245,179,66,0.2);
        }
        .auth-buttons .login {
            border-color: #f5b342;
            color: #f5b342;
        }
        .auth-buttons .register {
            background: #f5b342;
            border-color: #f5b342;
            color: #111;
        }
        .auth-buttons .register:hover {
            background: #ffd54f;
            border-color: #ffd54f;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .balance-top {
            background: #1a1a1a;
            padding: 4px 14px 6px 14px;
            border-radius: 12px;
            border: 1px solid #444;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }
        .balance-top:hover {
            border-color: #f5b342;
            background: #222;
            box-shadow: 0 0 15px rgba(245, 179, 66, 0.15);
        }
        .balance-label {
            font-size: 10px;
            color: #f5b342;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.8;
            line-height: 1.2;
        }
        .balance-amount {
            font-size: 17px;
            font-weight: 700;
            color: #f5b342;
            line-height: 1.3;
        }
        .balance-amount span {
            color: #f5b342;
        }
        .burger {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            flex-shrink: 0;
        }
        .burger span {
            display: block;
            width: 22px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: 0.3s;
        }

        /* Основной ряд */
        .body-row {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        /* Левое меню */
        .sidebar {
            width: 85px;
            flex-shrink: 0;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 12px 6px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.2s;
            overflow-y: auto;
        }
        .sidebar .menu-item {
            font-size: 12px;
            font-weight: 700;
            color: #ccc;
            padding: 10px 4px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.25s ease;
            text-align: center;
            letter-spacing: 0.3px;
            border: 2px solid transparent;
            background: #121212;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
            line-height: 1.2;
            word-break: break-word;
        }
        .sidebar .menu-item[data-action="quick"] {
            border-color: #ff6f00;
            color: #ffab00;
        }
        .sidebar .menu-item[data-action="bonuses"] {
            border-color: #2e7d32;
            color: #66bb6a;
        }
        .sidebar .menu-item[data-action="vip"] {
            border-color: #6a1b9a;
            color: #ce93d8;
        }
        .sidebar .menu-item[data-action="promotions"] {
            border-color: #c62828;
            color: #ef5350;
        }
        .sidebar .menu-item:hover {
            border-color: #f5b342 !important;
            color: #f5b342 !important;
            background: #1e1e2a;
            box-shadow: 0 0 20px rgba(245, 179, 66, 0.3);
            transform: scale(1.02);
        }
        .sidebar .menu-item:active {
            transform: scale(0.95);
        }

        /* Основная область */
        .main-area {
            flex: 1;
            background: #1a1a1a;
            border-radius: 20px;
            border: 1px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 18px;
            padding: 8px;
            min-height: 0;
            overflow: hidden;
            transition: 0.2s;
            position: relative;
        }
        .main-area canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 16px;
        }
        .main-area .plinko-ui {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .main-area .plinko-ui .bet-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .main-area .plinko-ui .bet-row input {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 40px;
            padding: 6px 14px;
            color: #fff;
            font-size: 16px;
            width: 80px;
            text-align: center;
            outline: none;
        }
        .main-area .plinko-ui .bet-row button {
            background: linear-gradient(145deg, #f5b342, #b8860b);
            border: none;
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: 700;
            font-size: 16px;
            color: #111;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #5a3a1a;
        }
        .main-area .plinko-ui .bet-row button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5a3a1a;
        }
        .main-area .plinko-ui .bet-row button:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5a3a1a;
            pointer-events: none;
        }
        .main-area .plinko-ui .result {
            font-size: 20px;
            font-weight: 700;
            color: #f5b342;
            min-height: 30px;
            text-align: center;
        }
        .main-area .plinko-ui .info {
            font-size: 14px;
            color: #888;
            text-align: center;
        }

        /* Иконка игры (показывается вместо игры до клика) */
        .game-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1f1f2a;
            border-radius: 24px;
            padding: 20px;
            border: 2px solid #444;
            transition: 0.25s;
            cursor: pointer;
            width: 120px;
            height: 120px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .game-icon:hover {
            border-color: #f5b342;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(245,179,66,0.2);
        }
        .game-icon .emoji {
            font-size: 48px;
        }
        .game-icon .label {
            font-size: 16px;
            font-weight: 600;
            color: #eee;
            margin-top: 8px;
        }

        .footer {
            text-align: center;
            color: #444;
            font-size: 11px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        /* Меню-бургер */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 300px;
            height: 100%;
            background: #1a1a1a;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            padding: 60px 24px 24px;
            border-left: 1px solid #333;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .menu-overlay.open {
            transform: translateX(0);
        }
        .menu-item-burger {
            font-size: 20px;
            font-weight: 600;
            color: #eee;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: 0.15s;
        }
        .menu-item-burger:active {
            color: #f5b342;
            transform: translateX(6px);
        }
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .backdrop.active {
            display: block;
        }

        /* Панель баланса */
        .balance-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 2px solid #f5b342;
            border-radius: 30px 30px 0 0;
            padding: 24px 20px 30px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 600;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
        }
        .balance-panel.open {
            transform: translateY(0);
        }
        .balance-panel .balance-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: #aaa;
        }
        .balance-panel .panel-balance-amount {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: #f5b342;
            margin-bottom: 24px;
        }
        .balance-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .balance-actions button {
            border: none;
            border-radius: 20px;
            padding: 16px 8px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .balance-actions button:active {
            transform: scale(0.94);
        }
        .btn-deposit {
            background: #2e7d32;
        }
        .btn-withdraw {
            background: #1565c0;
        }
        .btn-referral {
            background: #7b1fa2;
        }
        .btn-bonus {
            background: #4a2a5a;
            border: 1px solid #f5b342;
        }
        .btn-bonus .icon {
            font-size: 20px;
        }
        .panel-close {
            position: absolute;
            top: 12px;
            right: 20px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .panel-close:active { color: #fff; }

        @media (max-width: 480px) {
            .container { padding: 10px 12px; }
            .brand { font-size: 15px; padding: 2px 10px; }
            .auth-buttons button { font-size: 11px; padding: 3px 10px; }
            .balance-top { min-width: 60px; padding: 3px 10px 5px; }
            .balance-amount { font-size: 15px; }
            .balance-label { font-size: 9px; }
            .sidebar { width: 70px; padding: 8px 4px; gap: 8px; }
            .sidebar .menu-item { font-size: 10px; padding: 8px 2px; border-radius: 10px; }
            .main-area { padding: 4px; }
            .game-icon { width: 80px; height: 80px; padding: 12px; }
            .game-icon .emoji { font-size: 32px; }
            .game-icon .label { font-size: 12px; }
        }
        @media (max-width: 400px) {
            .header-left { gap: 6px; }
            .auth-buttons { gap: 4px; }
            .brand { font-size: 13px; padding: 2px 8px; }
            .auth-buttons button { font-size: 10px; padding: 2px 8px; }
            .sidebar { width: 60px; }
            .sidebar .menu-item { font-size: 9px; padding: 6px 2px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <div class="header">
        <div class="header-left">
            <div class="brand">TWIN BOL</div>
            <div class="auth-buttons">
                <button class="login" id="loginBtn">Вход</button>
                <button class="register" id="registerBtn">Регистрация</button>
            </div>
        </div>
        <div class="header-right">
            <div class="balance-top" id="balanceTop">
                <div class="balance-label">Ваш баланс</div>
                <div class="balance-amount">💰 <span id="balanceDisplay">1000</span></div>
            </div>
            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <!-- Основной ряд -->
    <div class="body-row">
        <div class="sidebar" id="sidebar">
            <div class="menu-item" data-action="quick">Quick Games</div>
            <div class="menu-item" data-action="bonuses">Bonuses</div>
            <div class="menu-item" data-action="vip">VIP Club</div>
            <div class="menu-item" data-action="promotions">Promotions</div>
        </div>
        <div class="main-area" id="mainArea">
            <!-- По умолчанию – приветствие -->
            <span style="color:#555;">Выберите раздел</span>
        </div>
    </div>

    <div class="footer">TWIN BOL — играй и выигрывай</div>
</div>

<!-- Бэкдроп -->
<div class="backdrop" id="backdrop"></div>

<!-- Меню-бургер -->
<div class="menu-overlay" id="menuOverlay">
    <div class="menu-item-burger" data-action="settings">⚙️ Настройки</div>
    <div class="menu-item-burger" data-action="history">📜 История</div>
    <div class="menu-item-burger" data-action="support">🆘 Поддержка</div>
    <div class="menu-item-burger" data-action="bonus">🎁 Бонуски</div>
</div>

<!-- Панель баланса -->
<div class="balance-panel" id="balancePanel">
    <button class="panel-close" id="panelClose">✕</button>
    <div class="balance-title">Ваш баланс</div>
    <div class="panel-balance-amount" id="panelBalance">1000</div>
    <div class="balance-actions">
        <button class="btn-deposit">💰 Пополнение</button>
        <button class="btn-withdraw">💳 Вывод</button>
        <button class="btn-referral">👥 Реферальная программа %</button>
        <button class="btn-bonus"><span class="icon">🎁</span> Бонус</button>
    </div>
</div>

<script>
    // ===== БАЛАНС =====
    let balance = 1000;
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').textContent = balance;
        document.getElementById('panelBalance').textContent = balance;
    }
    updateBalanceUI();

    // ===== ПАНЕЛЬ БАЛАНСА =====
    const balancePanel = document.getElementById('balancePanel');
    const panelClose = document.getElementById('panelClose');

    function openPanel() {
        balancePanel.classList.add('open');
        document.getElementById('panelBalance').textContent = balance;
    }
    function closePanel() {
        balancePanel.classList.remove('open');
    }

    document.getElementById('balanceTop').addEventListener('click', (e) => {
        e.stopPropagation();
        if (balancePanel.classList.contains('open')) closePanel();
        else openPanel();
    });

    panelClose.addEventListener('click', closePanel);

    document.addEventListener('click', (e) => {
        if (balancePanel.classList.contains('open')) {
            const balanceTop = document.getElementById('balanceTop');
            if (!balancePanel.contains(e.target) && e.target !== balanceTop && !balanceTop.contains(e.target)) {
                closePanel();
            }
        }
    });

    document.querySelectorAll('.balance-actions button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const text = this.innerText.trim();
            alert(`Вы выбрали: ${text}`);
            closePanel();
        });
    });

    // ===== МЕНЮ-БУРГЕР =====
    const burgerBtn = document.getElementById('burgerBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const backdrop = document.getElementById('backdrop');

    function openMenu() {
        menuOverlay.classList.add('open');
        backdrop.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
        menuOverlay.classList.remove('open');
        backdrop.classList.remove('active');
        document.body.style.overflow = '';
    }
    burgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (menuOverlay.classList.contains('open')) closeMenu();
        else openMenu();
    });
    backdrop.addEventListener('click', closeMenu);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

    document.querySelectorAll('.menu-item-burger').forEach(item => {
        item.addEventListener('click', () => {
            const action = item.dataset.action;
            let message = '';
            switch(action) {
                case 'settings': message = '⚙️ Настройки (скоро)'; break;
                case 'history': message = '📜 История ставок, выводов, пополнений'; break;
                case 'support': message = '🆘 Поддержка: напишите нам в Telegram'; break;
                case 'bonus': message = '🎁 Бонуски: активируйте промокод'; break;
                default: message = 'Пункт меню';
            }
            alert(message);
            closeMenu();
        });
    });

    // ===== КНОПКИ ВХОД / РЕГИСТРАЦИЯ =====
    document.getElementById('loginBtn').addEventListener('click', () => {
        alert('Форма входа (скоро)');
    });
    document.getElementById('registerBtn').addEventListener('click', () => {
        alert('Форма регистрации (скоро)');
    });

    // ===== ОБРАБОТЧИКИ БОКОВОГО МЕНЮ =====
    document.querySelectorAll('.sidebar .menu-item').forEach(item => {
        item.addEventListener('click', () => {
            const action = item.dataset.action;
            const mainArea = document.getElementById('mainArea');
            // Скрываем всё, показываем только то, что нужно
            switch(action) {
                case 'quick':
                    // Показываем иконку Plinko
                    mainArea.innerHTML = `
                        <div class="game-icon" id="plinkoIcon">
                            <div class="emoji">🟡</div>
                            <div class="label">Plinko</div>
                        </div>
                    `;
                    // По клику на иконку запускаем игру
                    document.getElementById('plinkoIcon').addEventListener('click', function() {
                        startPlinkoGame(mainArea);
                    });
                    break;
                case 'bonuses':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">🎁 Бонусы – скоро</span>`;
                    break;
                case 'vip':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">👑 VIP клуб – скоро</span>`;
                    break;
                case 'promotions':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">🔥 Акции – скоро</span>`;
                    break;
                default:
                    mainArea.innerHTML = `<span style="color:#555;">Выберите раздел</span>`;
            }
        });
    });

    // ===== ФУНКЦИЯ ЗАПУСКА PLINKO =====
    function startPlinkoGame(container) {
        // Вставляем Plinko UI
        container.innerHTML = `
            <div class="plinko-ui" id="plinkoUI">
                <canvas id="plinkoCanvas"></canvas>
                <div class="bet-row">
                    <input type="number" id="betInput" value="10" min="1">
                    <button id="dropBtn">Запустить шарик</button>
                </div>
                <div class="result" id="resultDisplay">Нажмите "Запустить шарик"</div>
                <div class="info">🎯 Винрейт: 42% | Множители: x1, x2, x4, x5, x7</div>
            </div>
        `;
        // Инициализируем игру
        initPlinko();
    }

    // ============================================================
    //  PLINKO – полная реализация
    // ============================================================
    let plinkoCanvas, ctx, canvasW, canvasH;
    let pegs = [];
    let slots = [];
    let ball = null;
    let animationId = null;
    let isDropping = false;
    let betAmount = 10;

    const MULTIPLIERS = [1, 2, 4, 5, 7];
    const ROWS = 10;
    const PEG_RADIUS = 6;
    const BALL_RADIUS = 8;
    const GRAVITY = 0.25;
    const BOUNCE = 0.5;

    function initPlinko() {
        plinkoCanvas = document.getElementById('plinkoCanvas');
        if (!plinkoCanvas) return;
        ctx = plinkoCanvas.getContext('2d');
        resizePlinko();
        window.addEventListener('resize', resizePlinko);
        buildBoard();
        drawBoard();

        const dropBtn = document.getElementById('dropBtn');
        if (dropBtn) {
            dropBtn.addEventListener('click', dropBall);
        }
        const betInput = document.getElementById('betInput');
        if (betInput) {
            betInput.addEventListener('change', function() {
                betAmount = parseInt(this.value) || 10;
            });
        }
    }

    function resizePlinko() {
        if (!plinkoCanvas) return;
        const rect = plinkoCanvas.parentElement.getBoundingClientRect();
        const w = rect.width - 16;
        const h = rect.height - 80;
        plinkoCanvas.width = Math.max(w, 200);
        plinkoCanvas.height = Math.max(h, 300);
        canvasW = plinkoCanvas.width;
        canvasH = plinkoCanvas.height;
        if (pegs.length > 0) buildBoard();
    }

    function buildBoard() {
        pegs = [];
        slots = [];
        const spacingX = canvasW / (ROWS + 1.5);
        const spacingY = (canvasH - 60) / (ROWS + 0.5);
        const startX = spacingX * 0.8;

        for (let row = 0; row < ROWS; row++) {
            const cols = row + 1;
            const offsetX = (canvasW - (cols - 1) * spacingX) / 2;
            for (let col = 0; col < cols; col++) {
                const x = offsetX + col * spacingX;
                const y = 30 + row * spacingY;
                pegs.push({ x, y, radius: PEG_RADIUS });
            }
        }

        const slotWidth = canvasW / MULTIPLIERS.length;
        for (let i = 0; i < MULTIPLIERS.length; i++) {
            const x = i * slotWidth + slotWidth / 2;
            const y = canvasH - 20;
            slots.push({
                x: x,
                y: y,
                width: slotWidth * 0.7,
                height: 20,
                multiplier: MULTIPLIERS[i],
                color: getMultiplierColor(MULTIPLIERS[i])
            });
        }
    }

    function getMultiplierColor(m) {
        if (m >= 7) return '#ef5350';
        if (m >= 5) return '#ff7043';
        if (m >= 4) return '#ffa726';
        if (m >= 2) return '#66bb6a';
        return '#42a5f5';
    }

    function drawBoard() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvasW, canvasH);

        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(0, 0, canvasW, canvasH);

        for (let p of pegs) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#555';
            ctx.fill();
            ctx.shadowColor = 'rgba(245,179,66,0.2)';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let s of slots) {
            const x = s.x - s.width / 2;
            const y = s.y - s.height / 2;
            ctx.fillStyle = s.color;
            ctx.shadowColor = 'rgba(255,255,255,0.1)';
            ctx.shadowBlur = 10;
            ctx.fillRect(x, y, s.width, s.height);
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('x' + s.multiplier, s.x, s.y);
        }

        if (ball) {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = '#f5b342';
            ctx.shadowColor = 'rgba(245,179,66,0.6)';
            ctx.shadowBlur = 20;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function dropBall() {
        if (isDropping) return;
        const betInput = document.getElementById('betInput');
        const bet = parseInt(betInput ? betInput.value : 10);
        if (isNaN(bet) || bet < 1) { alert('Введите ставку'); return; }
        if (bet > balance) { alert('Недостаточно средств!'); return; }

        balance -= bet;
        betAmount = bet;
        updateBalanceUI();

        const startX = canvasW / 2 + (Math.random() - 0.5) * 20;
        ball = {
            x: startX,
            y: 10,
            vx: (Math.random() - 0.5) * 0.5,
            vy: 0.5,
            radius: BALL_RADIUS
        };
        isDropping = true;
        document.getElementById('dropBtn').disabled = true;
        document.getElementById('resultDisplay').textContent = 'Шарик падает...';

        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function gameLoop() {
        if (!ball || !isDropping) {
            drawBoard();
            return;
        }

        ball.vy += GRAVITY;
        ball.x += ball.vx;
        ball.y += ball.vy;

        for (let p of pegs) {
            const dx = ball.x - p.x;
            const dy = ball.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < ball.radius + p.radius) {
                const angle = Math.atan2(dy, dx);
                const overlap = (ball.radius + p.radius - dist) * 0.5;
                ball.x += Math.cos(angle) * overlap;
                ball.y += Math.sin(angle) * overlap;
                const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                const newVx = Math.cos(angle) * speed * BOUNCE;
                const newVy = Math.sin(angle) * speed * BOUNCE;
                ball.vx = newVx + (Math.random() - 0.5) * 0.3;
                ball.vy = newVy + (Math.random() - 0.5) * 0.3;
            }
        }

        if (ball.x < ball.radius) { ball.x = ball.radius; ball.vx = -ball.vx * 0.8; }
        if (ball.x > canvasW - ball.radius) { ball.x = canvasW - ball.radius; ball.vx = -ball.vx * 0.8; }

        if (ball.y + ball.radius > canvasH - 10) {
            let targetSlot = slots[0];
            for (let s of slots) {
                if (Math.abs(ball.x - s.x) < Math.abs(ball.x - targetSlot.x)) {
                    targetSlot = s;
                }
            }
            const isWin = Math.random() < 0.42;
            let finalMultiplier = isWin ? targetSlot.multiplier : 0;
            let finalWin = isWin ? Math.floor(betAmount * finalMultiplier) : 0;
            if (isWin) {
                balance += finalWin;
                document.getElementById('resultDisplay').textContent = '🎉 Выигрыш! x' + finalMultiplier + ' +' + finalWin;
                document.getElementById('resultDisplay').style.color = '#4caf50';
            } else {
                document.getElementById('resultDisplay').textContent = '😞 Проигрыш -' + betAmount;
                document.getElementById('resultDisplay').style.color = '#f44336';
            }
            updateBalanceUI();
            isDropping = false;
            ball = null;
            document.getElementById('dropBtn').disabled = false;
            drawBoard();
            return;
        }

        drawBoard();
        animationId = requestAnimationFrame(gameLoop);
    }

    // Инициализация при загрузке: показываем приветствие
    document.addEventListener('DOMContentLoaded', () => {
        const mainArea = document.getElementById('mainArea');
        mainArea.innerHTML = `<span style="color:#555;">Выберите раздел</span>`;
    });

    // Переинициализация при переключении вкладок
    window.initPlinko = initPlinko;
</script>
