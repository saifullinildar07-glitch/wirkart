<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>1WIN - UI Portal</title>
    <style>
        :root {
            --bg-main: #090d14;
            --bg-card: #121926;
            --bg-hover: #1c2536;
            --accent-blue: #0073ff;
            --accent-green: #00c853;
            --accent-gold: #ffb800;
            --text-gray: #7e8b9b;
            --border: #1e283a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        body { background: var(--bg-main); color: #fff; display: flex; justify-content: center; }

        .app { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #0b101a; }

        /* ШАПКА 1WIN */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #0e1420; border-bottom: 1px solid var(--border); }
        .logo { font-size: 20px; font-weight: 900; color: #fff; font-style: italic; letter-spacing: -1px; }
        .logo span { color: var(--accent-blue); }
        .user-block { display: flex; align-items: center; gap: 10px; }
        .balance-btn { background: #162030; border: 1px solid var(--border); padding: 5px 12px; border-radius: 8px; text-align: right; cursor: pointer; }
        .balance-val { color: var(--accent-gold); font-weight: 800; font-size: 14px; }
        .deposit-btn { background: linear-gradient(135deg, var(--accent-green), #009624); border: none; color: #fff; font-weight: 800; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; box-shadow: 0 0 12px rgba(0,200,83,0.3); }

        /* КАТЕГОРИИ (СКРОЛЛ) */
        .categories { display: flex; gap: 8px; padding: 10px 14px; overflow-x: auto; scrollbar-width: none; background: #0b101a; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip { background: #141c2b; border: 1px solid var(--border); color: var(--text-gray); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .cat-chip.active, .cat-chip:hover { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(0,115,255,0.4); }

        /* БАННЕР БОНУСА */
        .banner { margin: 0 14px 10px; background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,115,255,0.3); }
        .banner-title { font-size: 16px; font-weight: 900; text-transform: uppercase; }
        .banner-sub { font-size: 11px; opacity: 0.9; }

        /* СЕТКА ИГР */
        .content { flex: 1; overflow-y: auto; padding: 0 14px 20px; }
        .section-title { font-size: 13px; font-weight: 800; color: var(--text-gray); text-transform: uppercase; margin: 10px 0; display: flex; justify-content: space-between; }
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .game-card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; cursor: pointer; transition: 0.2s; height: 110px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
        .game-card:hover { transform: translateY(-2px); border-color: var(--accent-blue); box-shadow: 0 4px 15px rgba(0,115,255,0.25); }
        .game-card.lucky { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #3d0000 100%), #700000; }
        .game-card.mines { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #002b5c 100%), #001530; }
        .game-card.plinko { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #3a005c 100%), #1c0030; }
        .game-card.speed { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #4a3800 100%), #261d00; }
        
        .game-title { font-weight: 900; font-size: 14px; text-transform: uppercase; }
        .game-tag { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; color: var(--accent-gold); }

        /* МОДАЛКА ИГРЫ */
        .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; flex-direction: column; justify-content: flex-end; z-index: 100; }
        .modal.active { display: flex; }
        .modal-body { background: #0e1420; border-top: 2px solid var(--accent-blue); border-radius: 20px 20px 0 0; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .close-btn { align-self: flex-end; background: transparent; border: none; color: #fff; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app">
    <!-- ШАПКА -->
    <header class="header">
        <div class="logo">1WIN<span>.TEST</span></div>
        <div class="user-block">
            <div class="balance-btn" id="openDeposit">
                <div style="font-size: 9px; color: var(--text-gray);">БАЛАНС</div>
                <div class="balance-val">$<span id="bal">1000.00</span></div>
            </div>
            <button class="deposit-btn" id="depBtn">ПОПОЛНИТЬ</button>
        </div>
    </header>

    <!-- КАТЕГОРИИ -->
    <div class="categories">
        <div class="cat-chip active" onclick="filterCat('all')">🔥 Популярные</div>
        <div class="cat-chip" onclick="filterCat('fast')">⚡ Быстрые игры</div>
        <div class="cat-chip" onclick="filterCat('slots')">🎰 Слоты</div>
        <div class="cat-chip" onclick="filterCat('live')">🎥 Live Казино</div>
    </div>

    <!-- БАННЕР -->
    <div class="banner">
        <div>
            <div class="banner-title">Бонус +500%</div>
            <div class="banner-sub">На первый депозит для теста</div>
        </div>
        <button class="deposit-btn" style="background: #fff; color: #000;" onclick="addBonus()">Взять</button>
    </div>

    <!-- ИГРЫ -->
    <div class="content">
        <div class="section-title">
            <span>Быстрые игры 1win</span>
            <span style="color: var(--accent-blue); cursor: pointer;">Все (4)</span>
        </div>
        
        <div class="game-grid">
            <div class="game-card lucky" onclick="launchGame('Lucky Jet')">
                <span class="game-tag">TOP</span>
                <div class="game-title">Lucky Jet</div>
            </div>
            <div class="game-card mines" onclick="launchGame('Mines')">
                <span class="game-tag">X100</span>
                <div class="game-title">Mines</div>
            </div>
            <div class="game-card plinko" onclick="launchGame('Plinko')">
                <span class="game-tag">HOT</span>
                <div class="game-title">Plinko</div>
            </div>
            <div class="game-card speed" onclick="launchGame('Speed & Cash')">
                <span class="game-tag">NEW</span>
                <div class="game-title">Speed & Cash</div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА СТАВОК/ИГРЫ -->
    <div class="modal" id="gameModal">
        <div class="modal-body">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <h2 id="modalTitle" style="text-transform: uppercase;">ИГРА</h2>
            <p style="font-size: 13px; color: var(--text-gray);">Демо-эмулятор сессии. Баланс списывается локально.</p>
            <button class="deposit-btn" style="padding: 14px;" onclick="placeBet()">Сделать ставку $10</button>
        </div>
    </div>
</div>

<script>
    let balance = 1000.00;
    const balEl = document.getElementById('bal');
    const modal = document.getElementById('gameModal');
    const modalTitle = document.getElementById('modalTitle');

    function updateBalance(val) {
        balance += val;
        balEl.textContent = balance.toFixed(2);
    }

    function addBonus() {
        updateBalance(500);
        alert('Бонус +$500 зачислен!');
    }

    function launchGame(name) {
        modalTitle.textContent = name;
        modal.classList.add('active');
    }

    function closeModal() {
        modal.classList.remove('active');
    }

    function placeBet() {
        if (balance < 10) return alert('Недостаточно средств!');
        updateBalance(-10);
        const win = Math.random() > 0.5;
        if(win) {
            const prize = 25;
            updateBalance(prize);
            alert(`Выиграш +$${prize}!`);
        } else {
            alert('Ставка не сыграла.');
        }
    }

    function filterCat(cat) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
    }

    document.getElementById('depBtn').onclick = () => updateBalance(100);
</script>
</body>
</html>
