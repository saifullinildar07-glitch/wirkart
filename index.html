<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Casino</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #eee;
            font-family: Arial, sans-serif;
            padding-bottom: 70px;
            min-height: 100vh;
        }
        .container { max-width: 460px; margin: 0 auto; padding: 16px; }
        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }
        .logo { font-size: 24px; font-weight: 800; color: #f5b342; }
        .balance-top {
            background: #1e1e2a;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }
        .balance-top span { color: #f5b342; }
        /* Навигация снизу */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f0f18;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            max-width: 460px;
            margin: 0 auto;
            backdrop-filter: blur(6px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            padding: 4px 12px;
        }
        .nav-item .icon { font-size: 24px; }
        .nav-item.active { color: #f5b342; }
        /* Страницы */
        .page { display: none; }
        .page.active { display: block; }
        /* Карточки игр */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin: 20px 0;
        }
        .game-card {
            background: #16161f;
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            border: 1px solid #2a2a3a;
            cursor: pointer;
        }
        .game-card:active { transform: scale(0.96); }
        .game-card .icon { font-size: 40px; }
        .game-card .name { font-weight: 600; margin-top: 6px; }
        /* Игра Ракетка */
        .crash-area {
            background: #16161f;
            border-radius: 24px;
            padding: 20px;
            margin: 16px 0;
        }
        .crash-screen {
            background: #0d0d16;
            border-radius: 16px;
            padding: 30px 0;
            text-align: center;
        }
        .crash-number { font-size: 64px; font-weight: 800; color: #f5b342; }
        .bet-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .bet-row input {
            flex: 2;
            background: #1e1e2a;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 14px;
            color: #fff;
            font-size: 18px;
            outline: none;
        }
        .bet-row button {
            flex: 1;
            background: #f5b342;
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: 700;
            font-size: 18px;
            color: #000;
            cursor: pointer;
        }
        .bet-row button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .cashout-btn { background: #4caf50 !important; }
        .btn-back {
            background: #2a2a3a;
            border: none;
            border-radius: 40px;
            padding: 12px;
            color: #fff;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }
        /* Профиль */
        .profile-card {
            background: #16161f;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
        }
        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .profile-stats div {
            background: #0d0d16;
            padding: 12px;
            border-radius: 16px;
            min-width: 70px;
        }
        .profile-stats .label { font-size: 12px; color: #888; }
        .profile-stats .value { font-size: 20px; font-weight: 700; color: #f5b342; }
        .history-list {
            margin-top: 16px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #1a1a26;
        }
        .win { color: #4caf50; }
        .lose { color: #f44336; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #16161f;
            border-radius: 30px;
            padding: 30px;
            max-width: 320px;
            width: 90%;
        }
        .modal-content h3 { color: #f5b342; text-align: center; margin-bottom: 16px; }
        .modal-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .modal-buttons button {
            background: #1e1e2a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 14px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-close {
            background: #333;
            border: none;
            border-radius: 40px;
            padding: 12px;
            width: 100%;
            margin-top: 16px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div class="logo">🎰 CASINO</div>
            <div class="balance-top" onclick="openDeposit()">💰 <span id="balanceDisplay">1000</span></div>
        </div>

        <!-- Главная -->
        <div id="pageHome" class="page active">
            <div style="background:#16161f; border-radius:20px; padding:20px; text-align:center; margin-bottom:20px;">
                <div style="font-size:32px;">🔥</div>
                <div style="font-weight:700; font-size:20px;">Добро пожаловать!</div>
                <div style="color:#888;">Выбери игру</div>
            </div>
            <div class="game-grid">
                <div class="game-card" onclick="navigateTo('crash')">
                    <div class="icon">🚀</div>
                    <div class="name">Ракетка</div>
                </div>
                <div class="game-card" onclick="alert('Скоро')">
                    <div class="icon">🎰</div>
                    <div class="name">Слоты</div>
                </div>
                <div class="game-card" onclick="alert('Скоро')">
                    <div class="icon">🃏</div>
                    <div class="name">Блэкджек</div>
                </div>
                <div class="game-card" onclick="alert('Скоро')">
                    <div class="icon">🎲</div>
                    <div class="name">Кости</div>
                </div>
            </div>
        </div>

        <!-- Ракетка -->
        <div id="pageCrash" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:28px;">🚀</span>
                <span style="font-weight:700;">Ракетка</span>
                <span style="background:#1e1e2a; padding:2px 16px; border-radius:20px; font-size:14px;">#123</span>
            </div>
            <div class="crash-area">
                <div class="crash-screen">
                    <div class="crash-number" id="crashNumber">1.00x</div>
                    <div style="font-size:14px; color:#888;" id="crashStatus">Ожидание</div>
                </div>
                <div class="bet-row">
                    <input type="number" id="betInput" value="10" min="1">
                    <button id="crashActionBtn">СТАВКА</button>
                </div>
                <button id="cashoutBtn" class="cashout-btn" style="width:100%; margin-top:8px; display:none;" disabled>ЗАБРАТЬ</button>
            </div>
            <button class="btn-back" onclick="navigateTo('home')">← Назад</button>
        </div>

        <!-- Профиль -->
        <div id="pageProfile" class="page">
            <div class="profile-card">
                <div style="font-size:48px;">👤</div>
                <div style="font-weight:700; font-size:20px;">Игрок</div>
                <div class="profile-stats">
                    <div><div class="label">Баланс</div><div class="value" id="profileBalance">1000</div></div>
                    <div><div class="label">Игр</div><div class="value" id="gamesPlayed">0</div></div>
                    <div><div class="label">Выигрыши</div><div class="value" id="totalWins">0</div></div>
                </div>
                <button style="background:#f5b342; border:none; border-radius:40px; padding:14px; font-weight:700; width:100%; color:#000; cursor:pointer;" onclick="openDeposit()">Пополнить</button>
                <div class="history-list" id="profileHistory">
                    <div style="text-align:center; color:#666; padding:12px 0;">История пуста</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-item active" data-page="home" onclick="navigateTo('home')">
            <span class="icon">🏠</span>Главная
        </div>
        <div class="nav-item" data-page="crash" onclick="navigateTo('crash')">
            <span class="icon">🚀</span>Ракетка
        </div>
        <div class="nav-item" data-page="profile" onclick="navigateTo('profile')">
            <span class="icon">👤</span>Профиль
        </div>
    </div>

    <!-- Модалка пополнения -->
    <div class="modal" id="depositModal">
        <div class="modal-content">
            <h3>Пополнить</h3>
            <div class="modal-buttons">
                <button onclick="deposit(100)">100</button>
                <button onclick="deposit(500)">500</button>
                <button onclick="deposit(1000)">1000</button>
                <button onclick="deposit(5000)">5000</button>
                <button onclick="deposit(10000)">10000</button>
                <button onclick="deposit(25000)">25000</button>
            </div>
            <button class="modal-close" onclick="closeDeposit()">Закрыть</button>
        </div>
    </div>

    <script>
        // ===== БАЛАНС =====
        let balance = parseInt(localStorage.getItem('balance')) || 1000;
        let history = JSON.parse(localStorage.getItem('history')) || [];
        let games = parseInt(localStorage.getItem('games')) || 0;
        let wins = parseInt(localStorage.getItem('wins')) || 0;

        function save() {
            localStorage.setItem('balance', balance);
            localStorage.setItem('history', JSON.stringify(history));
            localStorage.setItem('games', games);
            localStorage.setItem('wins', wins);
        }

        function updateUI() {
            document.getElementById('balanceDisplay').textContent = balance;
            document.getElementById('profileBalance').textContent = balance;
            document.getElementById('gamesPlayed').textContent = games;
            document.getElementById('totalWins').textContent = wins;
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('profileHistory');
            if (history.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#666;padding:12px 0;">История пуста</div>';
                return;
            }
            let html = '';
            history.slice(-10).reverse().forEach(item => {
                const cls = item.win ? 'win' : 'lose';
                const sign = item.win ? '+' : '-';
                html += `<div class="history-item"><span>${item.game || 'Ракетка'}</span><span class="${cls}">${sign}${Math.abs(item.amount)}</span></div>`;
            });
            container.innerHTML = html;
        }

        // ===== НАВИГАЦИЯ =====
        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
            if (page !== 'crash') {
                if (crashInterval) clearInterval(crashInterval);
                crashRunning = false;
                document.getElementById('crashActionBtn').disabled = false;
                document.getElementById('crashActionBtn').textContent = 'СТАВКА';
                document.getElementById('cashoutBtn').style.display = 'none';
                document.getElementById('cashoutBtn').disabled = true;
                document.getElementById('crashStatus').textContent = 'Ожидание';
                document.getElementById('crashNumber').textContent = '1.00x';
            }
            updateUI();
        }

        // ===== ДЕПОЗИТ =====
        function openDeposit() { document.getElementById('depositModal').classList.add('open'); }
        function closeDeposit() { document.getElementById('depositModal').classList.remove('open'); }
        function deposit(amount) {
            balance += amount;
            history.push({ game: 'Пополнение', win: true, amount: amount });
            save(); updateUI(); closeDeposit();
        }

        // ===== ИГРА РАКЕТКА =====
        let crashRunning = false;
        let crashMultiplier = 1.0;
        let crashInterval = null;
        let betAmount = 0;
        let crashPoint = 0;

        const actionBtn = document.getElementById('crashActionBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const betInput = document.getElementById('betInput');
        const crashNumber = document.getElementById('crashNumber');
        const crashStatus = document.getElementById('crashStatus');

        function startCrash() {
            if (crashRunning) return;
            const bet = parseInt(betInput.value);
            if (bet < 1 || bet > balance) { alert('Некорректная ставка'); return; }
            balance -= bet;
            betAmount = bet;
            save(); updateUI();

            crashRunning = true;
            crashMultiplier = 1.0;
            crashNumber.textContent = '1.00x';
            crashStatus.textContent = '⬆️ Лети!';
            actionBtn.disabled = true;
            actionBtn.textContent = 'ИГРА...';
            cashoutBtn.style.display = 'block';
            cashoutBtn.disabled = false;

            crashPoint = 1.05 + Math.random() * 20;

            crashInterval = setInterval(() => {
                crashMultiplier += 0.02 + Math.random() * 0.04;
                crashMultiplier = Math.round(crashMultiplier * 100) / 100;
                crashNumber.textContent = crashMultiplier.toFixed(2) + 'x';

                if (crashMultiplier >= crashPoint) {
                    clearInterval(crashInterval);
                    crashRunning = false;
                    crashNumber.textContent = '💥 ' + crashMultiplier.toFixed(2) + 'x';
                    crashStatus.textContent = '💀 КРАШ';
                    cashoutBtn.disabled = true;
                    cashoutBtn.style.display = 'none';
                    actionBtn.disabled = false;
                    actionBtn.textContent = 'СТАВКА';
                    history.push({ game: 'Ракетка', win: false, amount: betAmount });
                    games++;
                    save(); updateUI();
                }
            }, 60);
        }

        function cashOut() {
            if (!crashRunning) return;
            const win = Math.floor(betAmount * crashMultiplier);
            balance += win;
            history.push({ game: 'Ракетка', win: true, amount: win });
            games++;
            wins += win;
            save(); updateUI();

            clearInterval(crashInterval);
            crashRunning = false;
            crashNumber.textContent = '✅ ' + crashMultiplier.toFixed(2) + 'x';
            crashStatus.textContent = '🎉 Выиграли ' + win;
            cashoutBtn.disabled = true;
            cashoutBtn.style.display = 'none';
            actionBtn.disabled = false;
            actionBtn.textContent = 'СТАВКА';
        }

        actionBtn.addEventListener('click', startCrash);
        cashoutBtn.addEventListener('click', cashOut);

        // ===== СТАРТ =====
        updateUI();
    </script>
</body>
</html>
