<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SHAHID ROCKET</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* Базовый фон и цвета */
        body {
            background: #0a0a1a;
            font-family: 'Inter', sans-serif;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Контейнер-карточка */
        .game-card {
            background: #14142a;
            border-radius: 32px;
            padding: 24px 20px;
            max-width: 480px;
            width: 100%;
            margin: 16px;
            border: 1px solid #2a2a4a;
            box-shadow: 0 20px 60px rgba(100, 50, 255, 0.15);
        }
        /* Кастомный скролл */
        ::-webkit-scrollbar { width: 0; }

        /* Логотип */
        .logo {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #f5b342, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Кнопки ставок */
        .bet-btn {
            background: #1e1e32;
            border: 1px solid #2a2a4a;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 600;
            font-size: 16px;
            color: #b388ff;
            cursor: pointer;
            transition: 0.15s;
        }
        .bet-btn:hover {
            background: #b388ff;
            color: #0a0a1a;
            border-color: #b388ff;
        }
        .bet-btn.active {
            background: #b388ff;
            color: #0a0a1a;
            border-color: #b388ff;
        }

        /* Основная кнопка СТАВКА */
        .btn-primary {
            background: linear-gradient(145deg, #b388ff, #7c4dff);
            color: #0a0a1a;
            font-weight: 800;
            padding: 14px 0;
            border: none;
            border-radius: 60px;
            box-shadow: 0 6px 0 #4a2a8a;
            transition: 0.1s;
            width: 100%;
            font-size: 18px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a2a8a;
        }
        .btn-primary:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4a2a8a;
            pointer-events: none;
        }

        /* Кнопка ЗАБРАТЬ */
        .btn-cashout {
            background: linear-gradient(145deg, #4caf50, #2e7d32);
            color: #fff;
            font-weight: 800;
            padding: 14px 0;
            border: none;
            border-radius: 60px;
            box-shadow: 0 6px 0 #1b5e20;
            transition: 0.1s;
            width: 100%;
            font-size: 18px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn-cashout:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1b5e20;
        }
        .btn-cashout:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1b5e20;
            pointer-events: none;
        }

        /* Адаптив для мобильных */
        @media (max-width: 480px) {
            .game-card { padding: 16px; margin: 8px; }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- Шапка -->
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-[#1a1a2e]">
            <div class="logo">🎰 SHAHID</div>
            <div class="bg-[#1a1a2e] px-5 py-2 rounded-full font-bold text-lg border border-[#2a2a4a] flex items-center gap-2 cursor-pointer" onclick="openDeposit()">
                💰 <span id="balanceDisplay" class="text-[#f5b342]">1000</span>
            </div>
        </div>

        <!-- Главная страница -->
        <div id="pageHome">
            <!-- Баннер -->
            <div class="bg-gradient-to-br from-[#1a1a2e] to-[#0d0d1a] rounded-3xl p-6 text-center border border-[#2a2a4a] mb-5">
                <div class="text-3xl font-extrabold text-[#f5b342] drop-shadow-[0_0_30px_rgba(245,179,66,0.3)]">🔥 ЗАПУСКАЙ РАКЕТУ</div>
                <div class="text-gray-400 mt-1 text-sm">Собирай звёзды и умножай ставку</div>
            </div>

            <!-- Сетка игр -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-[#14142a] rounded-2xl p-5 text-center border border-[#f5b342] relative cursor-pointer hover:scale-95 transition" onclick="startGame()">
                    <div class="text-5xl mb-1">🚀</div>
                    <div class="font-bold text-base">Ракетка</div>
                    <div class="text-gray-500 text-xs">Шахид-полёт</div>
                    <!-- Всплывающая подсказка -->
                    <div class="absolute -top-6 left-1/2 -translate-x-1/2 bg-[#0a0a1a] text-[#f5b342] px-3 py-0.5 rounded-full text-xs font-bold border border-[#f5b342] shadow-[0_0_20px_rgba(245,179,66,0.3)] whitespace-nowrap opacity-0 hover:opacity-100 transition-opacity pointer-events-none">
                        SHAHID ROCKET
                    </div>
                </div>
                <div class="bg-[#14142a] rounded-2xl p-5 text-center border border-[#2a2a4a] cursor-pointer hover:scale-95 transition" onclick="alert('Скоро')">
                    <div class="text-5xl mb-1">🎰</div>
                    <div class="font-bold text-base">Слоты</div>
                    <div class="text-gray-500 text-xs">Скоро</div>
                </div>
                <div class="bg-[#14142a] rounded-2xl p-5 text-center border border-[#2a2a4a] cursor-pointer hover:scale-95 transition" onclick="alert('Скоро')">
                    <div class="text-5xl mb-1">🎡</div>
                    <div class="font-bold text-base">Рулетка</div>
                    <div class="text-gray-500 text-xs">Скоро</div>
                </div>
                <div class="bg-[#14142a] rounded-2xl p-5 text-center border border-[#2a2a4a] cursor-pointer hover:scale-95 transition" onclick="alert('Скоро')">
                    <div class="text-5xl mb-1">🎲</div>
                    <div class="font-bold text-base">Кости</div>
                    <div class="text-gray-500 text-xs">Скоро</div>
                </div>
            </div>
        </div>

        <!-- Страница игры (скрыта) -->
        <div id="pageGame" style="display:none;">
            <!-- Верх игры -->
            <div class="flex justify-between items-center mb-3">
                <span class="text-xl font-extrabold text-[#b388ff] drop-shadow-[0_0_20px_rgba(179,136,255,0.4)]">🚀 SHAHID ROCKET</span>
                <span class="bg-[#2a1a3a] px-4 py-1 rounded-full text-sm text-[#b388ff]">#A7F3</span>
            </div>

            <!-- Canvas -->
            <div class="relative bg-[#0a0a1a] rounded-2xl overflow-hidden border border-[#3a2a5a] w-full aspect-[3/4] max-h-[420px]">
                <canvas id="gameCanvas" class="w-full h-full"></canvas>
                <!-- Множитель поверх -->
                <div class="absolute top-4 right-4 bg-black/50 backdrop-blur-sm px-4 py-1.5 rounded-full border border-[#5a3a8a] text-2xl font-black text-[#b388ff] drop-shadow-[0_0_30px_rgba(179,136,255,0.6)]" id="multiplierDisplay">1.00x</div>
                <!-- Счётчик звёзд -->
                <div class="absolute bottom-4 left-4 bg-black/40 backdrop-blur-sm px-4 py-1 rounded-full text-lg text-[#ffd54f] drop-shadow-[0_0_20px_rgba(255,213,79,0.4)]" id="starsCounter">⭐ 0</div>
            </div>

            <!-- Панель ставок -->
            <div class="mt-4 space-y-3">
                <!-- Быстрые кнопки ставок -->
                <div class="flex gap-2 flex-wrap">
                    <button class="bet-btn" data-amount="1">1</button>
                    <button class="bet-btn" data-amount="2">2</button>
                    <button class="bet-btn" data-amount="5">5</button>
                    <button class="bet-btn" data-amount="10">10</button>
                    <button class="bet-btn" data-amount="25">25</button>
                    <button class="bet-btn" data-amount="50">50</button>
                    <button class="bet-btn" data-amount="100">100</button>
                </div>

                <!-- Поле ввода + кнопки -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center bg-[#1a1a2e] rounded-full px-2 py-1 border border-[#3a2a5a] flex-1">
                        <button id="betDec" class="w-9 h-9 text-2xl font-bold text-[#b388ff] bg-transparent border-0 cursor-pointer">−</button>
                        <input type="number" id="betInput" value="10" min="1" step="1" class="w-16 bg-transparent text-center text-white text-xl font-bold outline-none" />
                        <button id="betInc" class="w-9 h-9 text-2xl font-bold text-[#b388ff] bg-transparent border-0 cursor-pointer">+</button>
                    </div>
                    <button class="btn-primary flex-1" id="actionBtn">СТАВКА</button>
                </div>

                <!-- Кнопка ЗАБРАТЬ -->
                <button class="btn-cashout" id="cashoutBtn" disabled>ЗАБРАТЬ</button>
            </div>

            <!-- Список игроков -->
            <div class="mt-4 bg-[#14142a] rounded-2xl p-3 border border-[#2a2a4a] max-h-[120px] overflow-y-auto" id="playersList">
                <div class="text-center text-gray-500 py-3">Ожидание игроков...</div>
            </div>

            <!-- Кнопка назад -->
            <button class="w-full mt-3 bg-[#1e1e2e] border-0 rounded-full py-3 font-semibold text-white cursor-pointer hover:bg-[#2a2a3e] transition" onclick="goHome()">← На главную</button>
        </div>
    </div>

    <!-- Модалка пополнения -->
    <div id="depositModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" style="display:none;">
        <div class="bg-[#14142a] rounded-3xl p-8 max-w-xs w-[92%] border border-[#2a2a4a] shadow-2xl">
            <h3 class="text-center text-3xl font-extrabold text-[#f5b342] mb-4">Пополнить</h3>
            <div class="grid grid-cols-3 gap-3">
                <button class="bg-[#1a1a2e] border border-[#333] rounded-xl py-4 font-bold text-white text-lg cursor-pointer hover:bg-[#f5b342] hover:text-black hover:border-[#f5b342]" onclick="deposit(100)">100</button>
                <button class="bg-[#1a1a2e] border border-[#333] rounded-xl py-4 font-bold text-white text-lg cursor-pointer hover:bg-[#f5b342] hover:text-black hover:border-[#f5b342]" onclick="deposit(500)">500</button>
                <button class="bg-[#1a1a2e] border border-[#333] rounded-xl py-4 font-bold text-white text-lg cursor-pointer hover:bg-[#f5b342] hover:text-black hover:border-[#f5b342]" onclick="deposit(1000)">1 000</button>
                <button class="bg-[#1a1a2e] border border-[#333] rounded-xl py-4 font-bold text-white text-lg cursor-pointer hover:bg-[#f5b342] hover:text-black hover:border-[#f5b342]" onclick="deposit(5000)">5 000</button>
                <button class="bg-[#1a1a2e] border border-[#333] rounded-xl py-4 font-bold text-white text-lg cursor-pointer hover:bg-[#f5b342] hover:text-black hover:border-[#f5b342]" onclick="deposit(10000)">10 000</button>
                <button class="bg-[#1a1a2e] border border-[#333] rounded-xl py-4 font-bold text-white text-lg cursor-pointer hover:bg-[#f5b342] hover:text-black hover:border-[#f5b342]" onclick="deposit(25000)">25 000</button>
            </div>
            <button class="w-full mt-4 bg-[#2a2a4a] border-0 rounded-full py-3 font-semibold text-white cursor-pointer hover:bg-[#444] transition" onclick="closeDeposit()">Закрыть</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  TELEGRAM WEB APP
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ============================================================
        //  БАЛАНС И ХРАНЕНИЕ
        // ============================================================
        let balance = parseInt(localStorage.getItem('sh_balance')) || 1000;
        let history = JSON.parse(localStorage.getItem('sh_history')) || [];
        let games = parseInt(localStorage.getItem('sh_games')) || 0;
        let wins = parseInt(localStorage.getItem('sh_wins')) || 0;

        function saveState() {
            localStorage.setItem('sh_balance', balance);
            localStorage.setItem('sh_history', JSON.stringify(history));
            localStorage.setItem('sh_games', games);
            localStorage.setItem('sh_wins', wins);
        }

        function updateUI() {
            document.getElementById('balanceDisplay').textContent = balance;
        }

        // ============================================================
        //  ДЕПОЗИТ
        // ============================================================
        function openDeposit() {
            document.getElementById('depositModal').style.display = 'flex';
        }
        function closeDeposit() {
            document.getElementById('depositModal').style.display = 'none';
        }
        function deposit(amount) {
            balance += amount;
            history.push({ game: 'Пополнение', win: true, amount: amount });
            saveState();
            updateUI();
            closeDeposit();
        }

        // ============================================================
        //  НАВИГАЦИЯ
        // ============================================================
        function goHome() {
            document.getElementById('pageHome').style.display = 'block';
            document.getElementById('pageGame').style.display = 'none';
            if (gameInterval) cancelAnimationFrame(gameInterval);
            gameRunning = false;
            document.getElementById('actionBtn').disabled = false;
            document.getElementById('actionBtn').textContent = 'СТАВКА';
            document.getElementById('cashoutBtn').disabled = true;
            document.getElementById('multiplierDisplay').textContent = '1.00x';
            document.getElementById('starsCounter').textContent = '⭐ 0';
            document.getElementById('playersList').innerHTML = '<div class="text-center text-gray-500 py-3">Ожидание игроков...</div>';
            particles = [];
            updateUI();
        }

        // ============================================================
        //  CANVAS
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let canvasWidth, canvasHeight;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            canvasWidth = canvas.width;
            canvasHeight = canvas.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============================================================
        //  ИГРОВЫЕ ПЕРЕМЕННЫЕ
        // ============================================================
        let gameRunning = false;
        let multiplier = 1.0;
        let stars = 0;
        let betAmount = 0;
        let crashPoint = 1.0;
        let gameInterval = null;

        // Ракета
        let rocketX, rocketY;
        let rocketSpeed = 1.6;
        let rocketAngle = 0;

        // Звёзды
        let starsArray = [];
        let starGenCounter = 0;

        // Частицы
        let particles = [];

        // Фоновые линии
        let backgroundLines = [];

        function initBackgroundLines() {
            backgroundLines = [];
            for (let i = 0; i < 14; i++) {
                backgroundLines.push({
                    x: Math.random() * canvasWidth,
                    y: Math.random() * canvasHeight,
                    length: 30 + Math.random() * 70,
                    speed: 0.4 + Math.random() * 1.6,
                    opacity: 0.04 + Math.random() * 0.12,
                    color: ['#b388ff', '#7c4dff', '#4fc3f7', '#ffd54f'][Math.floor(Math.random() * 4)]
                });
            }
        }
        initBackgroundLines();

        // Генерация краш-точки (честный рандом)
        function generateCrashPoint() {
            // 60% — краш до 2x, 40% — от 2x до 30x
            if (Math.random() < 0.6) {
                return 1.05 + Math.random() * 0.95;
            } else {
                return 2.0 + Math.random() * 28.0;
            }
        }

        // ============================================================
        //  ЗАПУСК ИГРЫ
        // ============================================================
        function startGame() {
            if (gameRunning) return;
            const bet = parseInt(document.getElementById('betInput').value);
            if (isNaN(bet) || bet < 1) { alert('Введите ставку'); return; }
            if (bet > balance) { alert('Недостаточно средств!'); return; }

            // Переключаем на страницу игры
            document.getElementById('pageHome').style.display = 'none';
            document.getElementById('pageGame').style.display = 'block';

            balance -= bet;
            betAmount = bet;
            saveState();
            updateUI();

            // Сброс
            multiplier = 1.0;
            stars = 0;
            rocketX = canvasWidth / 2;
            rocketY = canvasHeight * 0.85;
            rocketAngle = 0.05;
            starsArray = [];
            particles = [];
            starGenCounter = 0;
            crashPoint = generateCrashPoint();

            gameRunning = true;
            document.getElementById('actionBtn').disabled = true;
            document.getElementById('actionBtn').textContent = 'ИГРА...';
            document.getElementById('cashoutBtn').disabled = false;
            document.getElementById('multiplierDisplay').textContent = '1.00x';
            document.getElementById('starsCounter').textContent = '⭐ 0';

            // Список игроков (заглушка)
            const fakeNames = ['xX_Shahid_Xx', 'RocketMan', 'StarGazer', 'CryptoKing', 'MoonWalker', 'NeonGhost', 'LuckyStrike', 'FireFly'];
            const count = 3 + Math.floor(Math.random() * 5);
            let players = [];
            for (let i = 0; i < count; i++) {
                const name = fakeNames[Math.floor(Math.random() * fakeNames.length)] + (Math.random() > 0.5 ? Math.floor(Math.random() * 100) : '');
                players.push({ nick: name, bet: Math.floor(Math.random() * 50) + 5 });
            }
            const list = document.getElementById('playersList');
            list.innerHTML = players.map(p =>
                `<div class="flex justify-between py-1.5 border-b border-[#1a1a2e] text-sm">
                    <span class="text-[#b388ff]">${p.nick}</span>
                    <span class="text-gray-400">ставка: <span class="text-[#ffd54f]">${p.bet}</span></span>
                </div>`
            ).join('');

            if (gameInterval) cancelAnimationFrame(gameInterval);
            gameLoop();
        }

        // ============================================================
        //  ИГРОВОЙ ЦИКЛ
        // ============================================================
        function gameLoop() {
            if (!gameRunning) return;

            // 1. Движение ракеты вверх
            rocketY -= rocketSpeed;
            rocketAngle = 0.05 * Math.sin(Date.now() / 300);
            if (rocketY < -60) {
                rocketY = canvasHeight + 40;
                rocketX = canvasWidth / 2 + (Math.random() - 0.5) * 40;
            }

            // 2. Генерация звёзд
            starGenCounter++;
            if (starGenCounter % 5 === 0) {
                const starX = Math.random() * canvasWidth;
                const starY = Math.random() * canvasHeight * 0.5;
                const size = 6 + Math.random() * 14;
                starsArray.push({
                    x: starX,
                    y: starY,
                    size: size,
                    speedY: 0.7 + Math.random() * 2.0,
                    speedX: (Math.random() - 0.5) * 0.8
                });
            }

            // 3. Движение звёзд вниз
            starsArray.forEach(star => {
                star.y += star.speedY;
                star.x += star.speedX;
            });
            starsArray = starsArray.filter(star => star.y < canvasHeight + 20);

            // 4. Сбор звёзд
            const rocketRadius = 22;
            starsArray.forEach((star, index) => {
                const dx = rocketX - star.x;
                const dy = rocketY - star.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < rocketRadius + star.size / 2) {
                    stars++;
                    starsArray.splice(index, 1);
                    document.getElementById('starsCounter').textContent = '⭐ ' + stars;
                }
            });

            // 5. Рост множителя
            multiplier += 0.012 + (stars * 0.0004);
            multiplier = Math.round(multiplier * 100) / 100;
            document.getElementById('multiplierDisplay').textContent = multiplier.toFixed(2) + 'x';

            // 6. Проверка краша
            if (multiplier >= crashPoint) {
                crashGame();
                return;
            }

            // 7. Отрисовка
            drawCanvas();

            gameInterval = requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  ОТРИСОВКА
        // ============================================================
        function drawCanvas() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Фон
            const grad = ctx.createRadialGradient(canvasWidth * 0.5, canvasHeight * 0.3, 0, canvasWidth * 0.5, canvasHeight * 0.3, canvasWidth * 0.8);
            grad.addColorStop(0, '#2a1a5a');
            grad.addColorStop(1, '#0a0a1a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Фоновые линии
            backgroundLines.forEach(line => {
                line.y += line.speed;
                if (line.y > canvasHeight) {
                    line.y = -line.length;
                    line.x = Math.random() * canvasWidth;
                }
                ctx.globalAlpha = line.opacity;
                ctx.strokeStyle = line.color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(line.x, line.y);
                ctx.lineTo(line.x + 10, line.y + line.length);
                ctx.stroke();
            });
            ctx.globalAlpha = 1;

            // Мелкие звёзды фона
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            for (let i = 0; i < 70; i++) {
                const sx = (i * 137) % canvasWidth;
                const sy = (i * 251) % canvasHeight;
                ctx.beginPath();
                ctx.arc(sx, sy, 1 + (i % 4), 0, Math.PI * 2);
                ctx.fill();
            }

            // Игровые звёзды
            starsArray.forEach(star => {
                ctx.shadowColor = '#ffd54f';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#ffd54f';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Ракета
            drawRocket(rocketX, rocketY, rocketAngle);

            // Частицы
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.life -= 0.02;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            particles = particles.filter(p => p.life > 0);
        }

        // ============================================================
        //  РИСОВАНИЕ РАКЕТЫ
        // ============================================================
        function drawRocket(x, y, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const flameHeight = 20 + 8 * Math.sin(Date.now() / 100);

            // Пламя
            ctx.shadowColor = '#ff6f00';
            ctx.shadowBlur = 50;
            ctx.fillStyle = '#ff6f00';
            ctx.beginPath();
            ctx.moveTo(-10, 20);
            ctx.lineTo(0, 20 + flameHeight);
            ctx.lineTo(10, 20);
            ctx.fill();
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#ffab00';
            ctx.beginPath();
            ctx.moveTo(-6, 20);
            ctx.lineTo(0, 20 + flameHeight * 0.7);
            ctx.lineTo(6, 20);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Корпус
            ctx.shadowColor = '#b388ff';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#7c4dff';
            ctx.beginPath();
            ctx.moveTo(0, -28);
            ctx.lineTo(-18, 20);
            ctx.lineTo(18, 20);
            ctx.closePath();
            ctx.fill();

            // Нос
            ctx.fillStyle = '#b388ff';
            ctx.beginPath();
            ctx.moveTo(0, -34);
            ctx.lineTo(-12, -18);
            ctx.lineTo(12, -18);
            ctx.closePath();
            ctx.fill();

            // Иллюминатор
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#4fc3f7';
            ctx.beginPath();
            ctx.arc(0, -5, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a0a1a';
            ctx.beginPath();
            ctx.arc(3, -7, 4, 0, Math.PI * 2);
            ctx.fill();

            // Крылья
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#4a2a8a';
            ctx.beginPath();
            ctx.moveTo(-18, 6);
            ctx.lineTo(-32, 16);
            ctx.lineTo(-18, 14);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(18, 6);
            ctx.lineTo(32, 16);
            ctx.lineTo(18, 14);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // ============================================================
        //  КРАШ
        // ============================================================
        function crashGame() {
            gameRunning = false;
            if (gameInterval) cancelAnimationFrame(gameInterval);
            gameInterval = null;

            // Взрыв
            for (let i = 0; i < 100; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = 2 + Math.random() * 7;
                particles.push({
                    x: rocketX,
                    y: rocketY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 5 + Math.random() * 10,
                    color: ['#ff6f00', '#ffab00', '#ffd54f', '#ff3d00', '#b388ff', '#ffffff'][Math.floor(Math.random() * 6)],
                    life: 0.8 + Math.random() * 0.4
                });
            }

            document.getElementById('multiplierDisplay').textContent = '💥 ' + multiplier.toFixed(2) + 'x';
            document.getElementById('actionBtn').disabled = false;
            document.getElementById('actionBtn').textContent = 'СТАВКА';
            document.getElementById('cashoutBtn').disabled = true;

            history.push({ game: 'Шахид-ракет', win: false, amount: betAmount });
            games++;
            saveState();
            updateUI();

            setTimeout(() => { particles = []; }, 2500);
        }

        // ============================================================
        //  ЗАБРАТЬ
        // ============================================================
        function cashOut() {
            if (!gameRunning) return;
            const winAmount = Math.floor(betAmount * multiplier);
            balance += winAmount;
            history.push({ game: 'Шахид-ракет', win: true, amount: winAmount });
            games++;
            wins += winAmount;
            saveState();
            updateUI();

            gameRunning = false;
            if (gameInterval) cancelAnimationFrame(gameInterval);
            gameInterval = null;

            document.getElementById('multiplierDisplay').textContent = '✅ ' + multiplier.toFixed(2) + 'x';
            document.getElementById('actionBtn').disabled = false;
            document.getElementById('actionBtn').textContent = 'СТАВКА';
            document.getElementById('cashoutBtn').disabled = true;

            // Золотой дождь
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * 2 * Math.PI;
                const speed = 1 + Math.random() * 4;
                particles.push({
                    x: rocketX,
                    y: rocketY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 4 + Math.random() * 8,
                    color: '#ffd54f',
                    life: 0.5 + Math.random() * 0.6
                });
            }
            setTimeout(() => { particles = []; }, 1800);
        }

        // ============================================================
        //  ОБРАБОТЧИКИ
        // ============================================================
        // Быстрые кнопки ставок
        document.querySelectorAll('.bet-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('betInput').value = this.dataset.amount;
                document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // +/- ставки
        document.getElementById('betDec').addEventListener('click', () => {
            let val = parseInt(document.getElementById('betInput').value) || 1;
            if (val > 1) val--;
            document.getElementById('betInput').value = val;
        });
        document.getElementById('betInc').addEventListener('click', () => {
            let val = parseInt(document.getElementById('betInput').value) || 1;
            val++;
            document.getElementById('betInput').value = val;
        });

        document.getElementById('actionBtn').addEventListener('click', startGame);
        document.getElementById('cashoutBtn').addEventListener('click', cashOut);

        // ============================================================
        //  СТАРТ
        // ============================================================
        updateUI();
        console.log('SHAHID ROCKET v4 — готовый движок');
    </script>

</body>
</html>
