<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VULKAN CASINO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            color: #f0e6d3;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding-bottom: 80px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { width:0; }
        :root {
            --gold: #d4a373;
            --gold-dark: #b8860b;
            --red: #8b1a1a;
            --dark: #1a1a1a;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 2px solid var(--gold);
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold), #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .balance-top {
            background: var(--dark);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid var(--gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .balance-top span { color: var(--gold); }

        .page { display: none; animation: fade 0.25s; }
        .page.active { display: block; }
        @keyframes fade { from { opacity:0.3; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

        .nav {
            position: fixed;
            bottom:0; left:0; right:0;
            background: #0f0f0f;
            border-top: 2px solid var(--gold);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 12px;
            max-width: 480px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
            padding: 4px 12px;
            background: transparent;
            border: none;
            font-family: inherit;
        }
        .nav-item .icon { font-size: 28px; }
        .nav-item.active { color: var(--gold); }
        .nav-item:active { transform:scale(0.9); }

        .game-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 20px;
            margin: 16px 0;
            border: 1px solid #2a2a2a;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:active { transform:scale(0.95); border-color: var(--gold); }
        .game-card .icon { font-size: 48px; }
        .game-card .name { font-size: 20px; font-weight: 700; margin: 8px 0; }

        /* Слоты */
        .slots {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 48px;
            background: #0f0f0f;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
            margin: 16px 0;
        }
        .slot-reel { min-width: 60px; text-align:center; }

        /* Рулетка */
        .roulette-wheel {
            background: #0f0f0f;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            margin: 16px auto;
            border: 4px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            transition: 0.3s;
        }
        .roulette-bets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .roulette-bets button {
            background: var(--dark);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .roulette-bets button:active { background: var(--gold); color: #000; }

        .bet-panel {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .bet-panel input {
            flex: 2;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 40px;
            padding: 14px 18px;
            color: #fff;
            font-size: 18px;
            outline: none;
            min-width: 100px;
        }
        .bet-panel button {
            flex: 1;
            background: linear-gradient(145deg, var(--gold), var(--gold-dark));
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-weight: 700;
            font-size: 18px;
            color: #000;
            cursor: pointer;
            box-shadow: 0 4px 0 #5a3a1a;
        }
        .bet-panel button:active { transform:translateY(4px); box-shadow:0 0px 0 #5a3a1a; }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 16px;
            margin: 16px 0;
        }
        .profile-stats div { text-align:center; }
        .profile-stats .label { color: #888; font-size:12px; }
        .profile-stats .value { font-size:24px; font-weight:700; color:var(--gold); }

        .history-list {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .history-item .win { color:#4caf50; }
        .history-item .lose { color:#f44336; }

        .modal {
            display: none;
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #1a1a1a;
            border-radius: 40px;
            padding: 30px 24px;
            max-width: 360px;
            width: 90%;
            border: 1px solid var(--gold);
        }
        .modal-content h3 { color: var(--gold); text-align:center; margin-bottom:20px; }
        .modal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .modal-grid button {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 14px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .modal-grid button:active { background: var(--gold); color:#000; }
        .modal-close {
            background: #333;
            border: none;
            border-radius: 40px;
            padding: 12px;
            width: 100%;
            margin-top: 16px;
            color: #fff;
            cursor: pointer;
        }

        .btn-back {
            background: #2a2a2a;
            border: none;
            border-radius: 40px;
            padding: 14px;
            width: 100%;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        .btn-back:active { background: #444; }

        /* Адаптив */
        @media (max-width: 400px) { .roulette-wheel { width:150px; height:150px; font-size:36px; } }
    </style>
</head>
<body>
<div class="container">

    <!-- Шапка -->
    <div class="header">
        <div class="logo">🔥 VULKAN</div>
        <div class="balance-top" onclick="openDeposit()">
            💰 <span id="balanceDisplay">1000</span>
        </div>
    </div>

    <!-- Страница: Главная -->
    <div id="pageHome" class="page active">
        <div style="background: #1a1a1a; border-radius: 30px; padding: 24px; text-align:center; border:1px solid var(--gold); margin-bottom:20px;">
            <div style="font-size:36px;">🎰</div>
            <div style="font-size:22px; font-weight:700;">Добро пожаловать в VULKAN</div>
            <div style="color:#888;">Выбирай игру и выигрывай</div>
        </div>

        <div class="game-card" onclick="navigateTo('slots')">
            <div class="icon">🎰</div>
            <div class="name">Слоты</div>
            <div style="color:#888;">Крути барабаны</div>
        </div>
        <div class="game-card" onclick="navigateTo('roulette')">
            <div class="icon">🎡</div>
            <div class="name">Рулетка</div>
            <div style="color:#888;">Красное / Чёрное</div>
        </div>
        <div class="game-card" onclick="navigateTo('rocket')">
            <div class="icon">🚀</div>
            <div class="name">Ракетка</div>
            <div style="color:#888;">Умножай ставку</div>
        </div>
    </div>

    <!-- Страница: Слоты -->
    <div id="pageSlots" class="page">
        <h2 style="color:var(--gold); text-align:center; margin:8px 0;">🎰 СЛОТЫ</h2>
        <div class="slots">
            <div class="slot-reel" id="reel1">🍒</div>
            <div class="slot-reel" id="reel2">🍒</div>
            <div class="slot-reel" id="reel3">🍒</div>
        </div>
        <div class="bet-panel">
            <input type="number" id="slotBet" value="10" min="1">
            <button id="spinBtn">КРУТИТЬ</button>
        </div>
        <button class="btn-back" onclick="navigateTo('home')">← На главную</button>
    </div>

    <!-- Страница: Рулетка -->
    <div id="pageRoulette" class="page">
        <h2 style="color:var(--gold); text-align:center; margin:8px 0;">🎡 РУЛЕТКА</h2>
        <div class="roulette-wheel" id="rouletteWheel">🎱</div>
        <div class="roulette-bets">
            <button onclick="rouletteBet('red')">🔴 Красное</button>
            <button onclick="rouletteBet('black')">⚫ Чёрное</button>
            <button onclick="rouletteBet('green')">🟢 Зелёное</button>
        </div>
        <div class="bet-panel">
            <input type="number" id="rouletteBet" value="10" min="1">
            <button id="rouletteSpinBtn">СТАВКА</button>
        </div>
        <div id="rouletteResult" style="text-align:center; margin-top:8px; font-size:20px;"></div>
        <button class="btn-back" onclick="navigateTo('home')">← На главную</button>
    </div>

    <!-- Страница: Ракетка (упрощённая версия) -->
    <div id="pageRocket" class="page">
        <h2 style="color:var(--gold); text-align:center; margin:8px 0;">🚀 РАКЕТКА</h2>
        <div style="background:#1a1a1a; border-radius:30px; padding:20px; text-align:center;">
            <div style="font-size:64px; font-weight:900; color:var(--gold);" id="rocketMultiplier">1.00x</div>
            <div style="color:#888;" id="rocketStatus">Ожидание ставки</div>
            <div class="bet-panel">
                <input type="number" id="rocketBet" value="10" min="1">
                <button id="rocketStartBtn">СТАВКА</button>
            </div>
            <button id="rocketCashoutBtn" style="background:#4caf50; border:none; border-radius:40px; padding:14px; font-weight:700; width:100%; color:#fff; display:none; margin-top:8px;">ЗАБРАТЬ</button>
        </div>
        <button class="btn-back" onclick="navigateTo('home')">← На главную</button>
    </div>

    <!-- Страница: Профиль -->
    <div id="pageProfile" class="page">
        <div style="background:#1a1a1a; border-radius:30px; padding:24px; text-align:center; border:1px solid var(--gold);">
            <div style="font-size:72px;">👤</div>
            <div style="font-size:24px; font-weight:700;">Игрок</div>
            <div class="profile-stats">
                <div><div class="label">Баланс</div><div class="value" id="profileBalance">1000</div></div>
                <div><div class="label">Игр</div><div class="value" id="gamesPlayed">0</div></div>
                <div><div class="label">Выигрыши</div><div class="value" id="totalWins">0</div></div>
            </div>
            <button style="background:var(--gold); border:none; border-radius:40px; padding:14px; font-weight:700; width:100%; color:#000; cursor:pointer;" onclick="openDeposit()">💵 Пополнить</button>
            <div class="history-list" id="profileHistory" style="margin-top:16px;">
                <div style="text-align:center;color:#888;">История пуста</div>
            </div>
        </div>
    </div>

</div>

<!-- Навигация -->
<div class="nav">
    <button class="nav-item active" data-page="home" onclick="navigateTo('home')">
        <span class="icon">🏠</span>Главная
    </button>
    <button class="nav-item" data-page="slots" onclick="navigateTo('slots')">
        <span class="icon">🎰</span>Слоты
    </button>
    <button class="nav-item" data-page="roulette" onclick="navigateTo('roulette')">
        <span class="icon">🎡</span>Рулетка
    </button>
    <button class="nav-item" data-page="profile" onclick="navigateTo('profile')">
        <span class="icon">👤</span>Профиль
    </button>
</div>

<!-- Модалка пополнения -->
<div class="modal" id="depositModal">
    <div class="modal-content">
        <h3>Пополнить баланс</h3>
        <div class="modal-grid">
            <button onclick="deposit(100)">100</button>
            <button onclick="deposit(500)">500</button>
            <button onclick="deposit(1000)">1 000</button>
            <button onclick="deposit(5000)">5 000</button>
            <button onclick="deposit(10000)">10 000</button>
            <button onclick="deposit(25000)">25 000</button>
        </div>
        <button class="modal-close" onclick="closeDeposit()">Закрыть</button>
    </div>
</div>

<script>
    // ========== TELEGRAM ==========
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ========== БАЛАНС И ХРАНЕНИЕ ==========
    let balance = parseInt(localStorage.getItem('vk_balance')) || 1000;
    let history = JSON.parse(localStorage.getItem('vk_history')) || [];
    let games = parseInt(localStorage.getItem('vk_games')) || 0;
    let wins = parseInt(localStorage.getItem('vk_wins')) || 0;

    function saveState() {
        localStorage.setItem('vk_balance', balance);
        localStorage.setItem('vk_history', JSON.stringify(history));
        localStorage.setItem('vk_games', games);
        localStorage.setItem('vk_wins', wins);
    }

    function updateUI() {
        document.getElementById('balanceDisplay').textContent = balance;
        document.getElementById('profileBalance').textContent = balance;
        document.getElementById('gamesPlayed').textContent = games;
        document.getElementById('totalWins').textContent = wins;
        renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('profileHistory');
        if (history.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#888;">История пуста</div>';
            return;
        }
        let html = '';
        history.slice(-15).reverse().forEach(item => {
            const cls = item.win ? 'win' : 'lose';
            const sign = item.win ? '+' : '-';
            html += `<div class="history-item"><span>${item.game || 'Игра'}</span><span class="${cls}">${sign}${Math.abs(item.amount)}</span></div>`;
        });
        container.innerHTML = html;
    }

    // ========== НАВИГАЦИЯ ==========
    function navigateTo(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
        if (page !== 'rocket') {
            if (rocketInterval) clearInterval(rocketInterval);
            rocketRunning = false;
            document.getElementById('rocketStartBtn').disabled = false;
            document.getElementById('rocketStartBtn').textContent = 'СТАВКА';
            document.getElementById('rocketCashoutBtn').style.display = 'none';
            document.getElementById('rocketStatus').textContent = 'Ожидание ставки';
            document.getElementById('rocketMultiplier').textContent = '1.00x';
        }
        updateUI();
    }

    // ========== ДЕПОЗИТ ==========
    function openDeposit() { document.getElementById('depositModal').classList.add('open'); }
    function closeDeposit() { document.getElementById('depositModal').classList.remove('open'); }
    function deposit(amount) {
        balance += amount;
        history.push({ game: 'Пополнение', win: true, amount: amount });
        saveState();
        updateUI();
        closeDeposit();
    }

    // ========== СЛОТЫ ==========
    const symbols = ['🍒', '🍋', '🍊', '🍇', '💎', '7️⃣', '⭐'];
    const reel1 = document.getElementById('reel1');
    const reel2 = document.getElementById('reel2');
    const reel3 = document.getElementById('reel3');

    document.getElementById('spinBtn').addEventListener('click', function() {
        const bet = parseInt(document.getElementById('slotBet').value);
        if (isNaN(bet) || bet < 1) { alert('Введите ставку'); return; }
        if (bet > balance) { alert('Недостаточно средств'); return; }

        balance -= bet;
        saveState();
        updateUI();

        // Анимация вращения
        const interval = setInterval(() => {
            reel1.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            reel2.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            reel3.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        }, 80);

        setTimeout(() => {
            clearInterval(interval);
            const r1 = symbols[Math.floor(Math.random() * symbols.length)];
            const r2 = symbols[Math.floor(Math.random() * symbols.length)];
            const r3 = symbols[Math.floor(Math.random() * symbols.length)];
            reel1.textContent = r1;
            reel2.textContent = r2;
            reel3.textContent = r3;

            let win = false;
            let amount = 0;
            if (r1 === r2 && r2 === r3) {
                win = true;
                amount = bet * 5;
                balance += amount;
                history.push({ game: 'Слоты', win: true, amount: amount });
                games++;
                wins += amount;
                alert('🎉 ДЖЕКПОТ! +' + amount);
            } else if (r1 === r2 || r2 === r3 || r1 === r3) {
                win = true;
                amount = bet * 2;
                balance += amount;
                history.push({ game: 'Слоты', win: true, amount: amount });
                games++;
                wins += amount;
                alert('🎉 Выигрыш! +' + amount);
            } else {
                history.push({ game: 'Слоты', win: false, amount: bet });
                games++;
                alert('😞 Проигрыш -' + bet);
            }
            saveState();
            updateUI();
        }, 1500);
    });

    // ========== РУЛЕТКА ==========
    let rouletteResult = 0;
    function rouletteBet(color) {
        const bet = parseInt(document.getElementById('rouletteBet').value);
        if (isNaN(bet) || bet < 1) { alert('Введите ставку'); return; }
        if (bet > balance) { alert('Недостаточно средств'); return; }

        balance -= bet;
        saveState();
        updateUI();

        const wheel = document.getElementById('rouletteWheel');
        const resultDiv = document.getElementById('rouletteResult');

        // Анимация вращения
        let spins = 20;
        const interval = setInterval(() => {
            const num = Math.floor(Math.random() * 37);
            const colors = ['red','black','green'];
            const colorMap = {0:'green', 1:'red', 2:'black', 3:'red', 4:'black', 5:'red', 6:'black', 7:'red', 8:'black', 9:'red', 10:'black', 11:'black', 12:'red', 13:'black', 14:'red', 15:'black', 16:'red', 17:'black', 18:'red', 19:'red', 20:'black', 21:'red', 22:'black', 23:'red', 24:'black', 25:'red', 26:'black', 27:'red', 28:'black', 29:'black', 30:'red', 31:'black', 32:'red', 33:'black', 34:'red', 35:'black', 36:'red'};
            const c = colorMap[num] || 'green';
            const emoji = c === 'red' ? '🔴' : (c === 'black' ? '⚫' : '🟢');
            wheel.textContent = emoji + ' ' + num;
            wheel.style.color = c === 'red' ? '#f44336' : (c === 'black' ? '#333' : '#4caf50');
            spins--;
            if (spins === 0) {
                clearInterval(interval);
                const finalNum = Math.floor(Math.random() * 37);
                const finalColor = colorMap[finalNum] || 'green';
                const emojiFinal = finalColor === 'red' ? '🔴' : (finalColor === 'black' ? '⚫' : '🟢');
                wheel.textContent = emojiFinal + ' ' + finalNum;
                wheel.style.color = finalColor === 'red' ? '#f44336' : (finalColor === 'black' ? '#333' : '#4caf50');

                let win = false;
                let amount = 0;
                if (color === finalColor) {
                    win = true;
                    amount = bet * 2;
                    balance += amount;
                    history.push({ game: 'Рулетка', win: true, amount: amount });
                    games++;
                    wins += amount;
                    resultDiv.textContent = '🎉 Выигрыш +' + amount;
                } else {
                    history.push({ game: 'Рулетка', win: false, amount: bet });
                    games++;
                    resultDiv.textContent = '😞 Проигрыш -' + bet;
                }
                saveState();
                updateUI();
            }
        }, 100);
    }

    // ========== РАКЕТКА (упрощённая) ==========
    let rocketRunning = false;
    let rocketMultiplier = 1.0;
    let rocketInterval = null;
    let rocketBet = 0;
    let rocketCrashPoint = 1.0;

    function generateCrash() {
        // 40% винрейт
        if (Math.random() < 0.4) {
            return 2.0 + Math.random() * 15;
        } else {
            return 1.05 + Math.random() * 0.95;
        }
    }

    document.getElementById('rocketStartBtn').addEventListener('click', function() {
        if (rocketRunning) return;
        const bet = parseInt(document.getElementById('rocketBet').value);
        if (isNaN(bet) || bet < 1) { alert('Введите ставку'); return; }
        if (bet > balance) { alert('Недостаточно средств'); return; }

        balance -= bet;
        rocketBet = bet;
        saveState();
        updateUI();

        rocketRunning = true;
        rocketMultiplier = 1.0;
        document.getElementById('rocketMultiplier').textContent = '1.00x';
        document.getElementById('rocketStatus').textContent = '🚀 Лети!';
        document.getElementById('rocketStartBtn').disabled = true;
        document.getElementById('rocketStartBtn').textContent = 'ИГРА...';
        document.getElementById('rocketCashoutBtn').style.display = 'block';
        document.getElementById('rocketCashoutBtn').disabled = false;

        rocketCrashPoint = generateCrash();

        rocketInterval = setInterval(() => {
            rocketMultiplier += 0.02 + Math.random() * 0.04;
            rocketMultiplier = Math.round(rocketMultiplier * 100) / 100;
            document.getElementById('rocketMultiplier').textContent = rocketMultiplier.toFixed(2) + 'x';

            if (rocketMultiplier >= rocketCrashPoint) {
                clearInterval(rocketInterval);
                rocketRunning = false;
                document.getElementById('rocketMultiplier').textContent = '💥 ' + rocketMultiplier.toFixed(2) + 'x';
                document.getElementById('rocketStatus').textContent = '💀 КРАШ';
                document.getElementById('rocketStartBtn').disabled = false;
                document.getElementById('rocketStartBtn').textContent = 'СТАВКА';
                document.getElementById('rocketCashoutBtn').style.display = 'none';
                history.push({ game: 'Ракетка', win: false, amount: rocketBet });
                games++;
                saveState();
                updateUI();
            }
        }, 100);
    });

    document.getElementById('rocketCashoutBtn').addEventListener('click', function() {
        if (!rocketRunning) return;
        const win = Math.floor(rocketBet * rocketMultiplier);
        balance += win;
        history.push({ game: 'Ракетка', win: true, amount: win });
        games++;
        wins += win;
        saveState();
        updateUI();

        clearInterval(rocketInterval);
        rocketRunning = false;
        document.getElementById('rocketMultiplier').textContent = '✅ ' + rocketMultiplier.toFixed(2) + 'x';
        document.getElementById('rocketStatus').textContent = '🎉 Выигрыш +' + win;
        document.getElementById('rocketStartBtn').disabled = false;
        document.getElementById('rocketStartBtn').textContent = 'СТАВКА';
        document.getElementById('rocketCashoutBtn').style.display = 'none';
    });

    // ========== СТАРТ ==========
    updateUI();
    console.log('VULKAN CASINO готов!');
</script>
</body>
</html>
