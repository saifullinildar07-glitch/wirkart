<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWIN BOL</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            height: 100vh;
            max-width: 480px;
            padding: 12px 16px;
            background: #000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-radius: 0;
            border: none;
            position: relative;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            gap: 8px;
            flex-wrap: nowrap;
            background: #000;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .brand {
            background: #6a1b9a;
            padding: 4px 14px;
            border-radius: 12px;
            border: 2px solid #f5b342;
            box-shadow: 0 0 15px rgba(245, 179, 66, 0.2);
            font-size: 18px;
            font-weight: 900;
            color: #f5b342;
            letter-spacing: 1px;
            text-transform: uppercase;
            user-select: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .brand:hover {
            box-shadow: 0 0 25px rgba(245, 179, 66, 0.5);
        }
        .auth-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .auth-buttons button {
            background: transparent;
            border: 1px solid #555;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #eee;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .auth-buttons button:hover {
            border-color: #f5b342;
            color: #f5b342;
            box-shadow: 0 0 12px rgba(245,179,66,0.2);
        }
        .auth-buttons .login {
            border-color: #f5b342;
            color: #f5b342;
        }
        .auth-buttons .register {
            background: #f5b342;
            border-color: #f5b342;
            color: #111;
        }
        .auth-buttons .register:hover {
            background: #ffd54f;
            border-color: #ffd54f;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .balance-top {
            background: #1a1a1a;
            padding: 4px 14px 6px 14px;
            border-radius: 12px;
            border: 1px solid #444;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }
        .balance-top:hover {
            border-color: #f5b342;
            background: #222;
            box-shadow: 0 0 15px rgba(245, 179, 66, 0.15);
        }
        .balance-label {
            font-size: 10px;
            color: #f5b342;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.8;
            line-height: 1.2;
        }
        .balance-amount {
            font-size: 17px;
            font-weight: 700;
            color: #f5b342;
            line-height: 1.3;
        }
        .balance-amount span {
            color: #f5b342;
        }
        .burger {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            flex-shrink: 0;
        }
        .burger span {
            display: block;
            width: 22px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: 0.3s;
        }

        .body-row {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            width: 85px;
            flex-shrink: 0;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 12px 6px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.2s;
            overflow-y: auto;
        }
        .sidebar .menu-item {
            font-size: 12px;
            font-weight: 700;
            color: #ccc;
            padding: 10px 4px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.25s ease;
            text-align: center;
            letter-spacing: 0.3px;
            border: 2px solid transparent;
            background: #121212;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
            line-height: 1.2;
            word-break: break-word;
        }
        .sidebar .menu-item[data-action="quick"] {
            border-color: #ff6f00;
            color: #ffab00;
        }
        .sidebar .menu-item[data-action="bonuses"] {
            border-color: #2e7d32;
            color: #66bb6a;
        }
        .sidebar .menu-item[data-action="vip"] {
            border-color: #6a1b9a;
            color: #ce93d8;
        }
        .sidebar .menu-item[data-action="promotions"] {
            border-color: #c62828;
            color: #ef5350;
        }
        .sidebar .menu-item:hover {
            border-color: #f5b342 !important;
            color: #f5b342 !important;
            background: #1e1e2a;
            box-shadow: 0 0 20px rgba(245, 179, 66, 0.3);
            transform: scale(1.02);
        }
        .sidebar .menu-item:active {
            transform: scale(0.95);
        }

        .main-area {
            flex: 1;
            background: #000;
            border-radius: 20px;
            border: 1px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 18px;
            padding: 8px;
            min-height: 0;
            overflow: hidden;
            transition: 0.2s;
            position: relative;
        }

        /* ===== Plinko с чёрным фоном ===== */
        .plinko-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
            border-radius: 20px;
            padding: 12px 12px 8px 12px;
            overflow-y: auto;
            position: relative;
        }
        .plinko-exit {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
            z-index: 10;
            padding: 4px 8px;
            border-radius: 20px;
            transition: 0.2s;
        }
        .plinko-exit:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .plinko-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #f5b342;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .plinko-multipliers {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 2px;
        }
        .plinko-multipliers .slot-label {
            flex: 1;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 0;
            border-radius: 4px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
        }
        .plinko-multipliers .slot-label.high {
            background: #9b59b6;
            color: #fff;
        }
        .plinko-multipliers .slot-label.mid {
            background: #2c3e50;
            color: #fff;
        }
        .plinko-multipliers .slot-label.low {
            background: #1a1a1a;
            color: #888;
        }
        .plinko-bet-balance {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
        }
        .plinko-bet-balance .bet {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .plinko-bet-balance .bet input {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 30px;
            padding: 4px 12px;
            width: 80px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            outline: none;
        }
        .plinko-bet-balance .balance {
            color: #f5b342;
        }
        .plinko-play-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 6px;
        }
        .plinko-play-row .play-btn {
            flex: 1;
            background: linear-gradient(145deg, #f5b342, #b8860b);
            border: none;
            border-radius: 30px;
            padding: 8px 0;
            font-weight: 700;
            font-size: 16px;
            color: #111;
            cursor: pointer;
            box-shadow: 0 4px 0 #5a3a1a;
            transition: 0.15s;
        }
        .plinko-play-row .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5a3a1a;
        }
        .plinko-play-row .play-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5a3a1a;
            pointer-events: none;
        }
        .plinko-mode {
            display: flex;
            gap: 4px;
            background: #2a2a3a;
            border-radius: 30px;
            padding: 2px;
        }
        .plinko-mode button {
            background: transparent;
            border: none;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
        }
        .plinko-mode button.active {
            background: #f5b342;
            color: #111;
        }
        .plinko-mode button:hover {
            color: #f5b342;
        }

        .plinko-canvas-wrap {
            flex: 1;
            min-height: 0;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 1px solid #333;
            margin-top: 4px;
        }
        .plinko-canvas-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        .footer {
            text-align: center;
            color: #444;
            font-size: 11px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 300px;
            height: 100%;
            background: #1a1a1a;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            padding: 60px 24px 24px;
            border-left: 1px solid #333;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .menu-overlay.open {
            transform: translateX(0);
        }
        .menu-item-burger {
            font-size: 20px;
            font-weight: 600;
            color: #eee;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: 0.15s;
        }
        .menu-item-burger:active {
            color: #f5b342;
            transform: translateX(6px);
        }
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .backdrop.active {
            display: block;
        }

        .balance-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 2px solid #f5b342;
            border-radius: 30px 30px 0 0;
            padding: 24px 20px 30px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 600;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
        }
        .balance-panel.open {
            transform: translateY(0);
        }
        .balance-panel .balance-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: #aaa;
        }
        .balance-panel .panel-balance-amount {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: #f5b342;
            margin-bottom: 24px;
        }
        .balance-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .balance-actions button {
            border: none;
            border-radius: 20px;
            padding: 16px 8px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .balance-actions button:active {
            transform: scale(0.94);
        }
        .btn-deposit {
            background: #2e7d32;
        }
        .btn-withdraw {
            background: #1565c0;
        }
        .btn-referral {
            background: #7b1fa2;
        }
        .btn-bonus {
            background: #4a2a5a;
            border: 1px solid #f5b342;
        }
        .btn-bonus .icon {
            font-size: 20px;
        }
        .panel-close {
            position: absolute;
            top: 12px;
            right: 20px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .panel-close:active { color: #fff; }

        @media (max-width: 480px) {
            .container { padding: 10px 12px; }
            .brand { font-size: 15px; padding: 2px 10px; }
            .auth-buttons button { font-size: 11px; padding: 3px 10px; }
            .balance-top { min-width: 60px; padding: 3px 10px 5px; }
            .balance-amount { font-size: 15px; }
            .balance-label { font-size: 9px; }
            .sidebar { width: 70px; padding: 8px 4px; gap: 8px; }
            .sidebar .menu-item { font-size: 10px; padding: 8px 2px; border-radius: 10px; }
            .main-area { padding: 4px; }
            .plinko-container { padding: 8px; }
            .plinko-multipliers .slot-label { font-size: 10px; }
            .plinko-bet-balance { font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <div class="brand">TWIN BOL</div>
            <div class="auth-buttons">
                <button class="login" id="loginBtn">Вход</button>
                <button class="register" id="registerBtn">Регистрация</button>
            </div>
        </div>
        <div class="header-right">
            <div class="balance-top" id="balanceTop">
                <div class="balance-label">Ваш баланс</div>
                <div class="balance-amount">💰 <span id="balanceDisplay">1000</span></div>
            </div>
            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <div class="body-row">
        <div class="sidebar" id="sidebar">
            <div class="menu-item" data-action="quick">Quick Games</div>
            <div class="menu-item" data-action="bonuses">Bonuses</div>
            <div class="menu-item" data-action="vip">VIP Club</div>
            <div class="menu-item" data-action="promotions">Promotions</div>
        </div>
        <div class="main-area" id="mainArea">
            <span style="color:#555;">Выберите раздел</span>
        </div>
    </div>

    <div class="footer">TWIN BOL — играй и выигрывай</div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="menu-overlay" id="menuOverlay">
    <div class="menu-item-burger" data-action="settings">⚙️ Настройки</div>
    <div class="menu-item-burger" data-action="history">📜 История</div>
    <div class="menu-item-burger" data-action="support">🆘 Поддержка</div>
    <div class="menu-item-burger" data-action="bonus">🎁 Бонуски</div>
</div>

<div class="balance-panel" id="balancePanel">
    <button class="panel-close" id="panelClose">✕</button>
    <div class="balance-title">Ваш баланс</div>
    <div class="panel-balance-amount" id="panelBalance">1000</div>
    <div class="balance-actions">
        <button class="btn-deposit">💰 Пополнение</button>
        <button class="btn-withdraw">💳 Вывод</button>
        <button class="btn-referral">👥 Реферальная программа %</button>
        <button class="btn-bonus"><span class="icon">🎁</span> Бонус</button>
    </div>
</div>

<script>
    // ===== ОБЩИЕ ФУНКЦИИ =====
    let balance = 1000;
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').textContent = balance;
        document.getElementById('panelBalance').textContent = balance;
        const plinkoBalanceEl = document.getElementById('plinkoBalance');
        if (plinkoBalanceEl) plinkoBalanceEl.textContent = balance.toFixed(2);
    }
    updateBalanceUI();

    // Панель баланса
    const balancePanel = document.getElementById('balancePanel');
    const panelClose = document.getElementById('panelClose');
    function openPanel() {
        balancePanel.classList.add('open');
        document.getElementById('panelBalance').textContent = balance;
    }
    function closePanel() {
        balancePanel.classList.remove('open');
    }
    document.getElementById('balanceTop').addEventListener('click', (e) => {
        e.stopPropagation();
        if (balancePanel.classList.contains('open')) closePanel();
        else openPanel();
    });
    panelClose.addEventListener('click', closePanel);
    document.addEventListener('click', (e) => {
        if (balancePanel.classList.contains('open')) {
            const balanceTop = document.getElementById('balanceTop');
            if (!balancePanel.contains(e.target) && e.target !== balanceTop && !balanceTop.contains(e.target)) {
                closePanel();
            }
        }
    });
    document.querySelectorAll('.balance-actions button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            alert(`Вы выбрали: ${this.innerText.trim()}`);
            closePanel();
        });
    });

    // Меню-бургер
    const burgerBtn = document.getElementById('burgerBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const backdrop = document.getElementById('backdrop');
    function openMenu() {
        menuOverlay.classList.add('open');
        backdrop.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
        menuOverlay.classList.remove('open');
        backdrop.classList.remove('active');
        document.body.style.overflow = '';
    }
    burgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (menuOverlay.classList.contains('open')) closeMenu();
        else openMenu();
    });
    backdrop.addEventListener('click', closeMenu);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    document.querySelectorAll('.menu-item-burger').forEach(item => {
        item.addEventListener('click', () => {
            alert(`Вы выбрали: ${this.textContent.trim()}`);
            closeMenu();
        });
    });
    document.getElementById('loginBtn').addEventListener('click', () => alert('Форма входа (скоро)'));
    document.getElementById('registerBtn').addEventListener('click', () => alert('Форма регистрации (скоро)'));

    // ===== БОКОВОЕ МЕНЮ =====
    document.querySelectorAll('.sidebar .menu-item').forEach(item => {
        item.addEventListener('click', function() {
            const action = this.dataset.action;
            const mainArea = document.getElementById('mainArea');
            switch(action) {
                case 'quick':
                    startPlinkoGame(mainArea);
                    break;
                case 'bonuses':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">🎁 Бонусы – скоро</span>`;
                    break;
                case 'vip':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">👑 VIP клуб – скоро</span>`;
                    break;
                case 'promotions':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">🔥 Акции – скоро</span>`;
                    break;
                default:
                    mainArea.innerHTML = `<span style="color:#555;">Выберите раздел</span>`;
            }
        });
    });

    // ============================================================
    //  PLINKO – ЧЁРНЫЙ ФОН, КРАСНЫЕ ШАРИКИ, БЕЛЫЕ КОЛЫШКИ
    // ============================================================
    function startPlinkoGame(container) {
        container.innerHTML = `
            <div class="plinko-container">
                <button class="plinko-exit" id="exitPlinko">←</button>
                <div class="plinko-title">PLINKO</div>
                <div class="plinko-multipliers" id="multipliersContainer">
                    <span class="slot-label high">x10</span>
                    <span class="slot-label high">x5</span>
                    <span class="slot-label mid">x2</span>
                    <span class="slot-label mid">x1</span>
                    <span class="slot-label low">x0.5</span>
                    <span class="slot-label mid">x1</span>
                    <span class="slot-label mid">x2</span>
                    <span class="slot-label high">x5</span>
                    <span class="slot-label high">x10</span>
                </div>
                <div class="plinko-bet-balance">
                    <div class="bet">
                        <span>Bet</span>
                        <input type="number" id="plinkoBet" value="1.00" step="0.01" min="0.01">
                        <span>FUN</span>
                    </div>
                    <div class="balance">
                        BALANCE <span id="plinkoBalance">${balance.toFixed(2)}</span> FUN
                    </div>
                </div>
                <div class="plinko-play-row">
                    <button class="play-btn" id="plinkoPlayBtn">PLAY</button>
                    <div class="plinko-mode">
                        <button class="active" data-mode="manual" id="modeManual">M</button>
                        <button data-mode="auto" id="modeAuto">A</button>
                    </div>
                </div>
                <div class="plinko-canvas-wrap">
                    <canvas id="plinkoCanvas"></canvas>
                </div>
            </div>
        `;

        // Элементы управления
        const exitBtn = document.getElementById('exitPlinko');
        const modeManual = document.getElementById('modeManual');
        const modeAuto = document.getElementById('modeAuto');
        const playBtn = document.getElementById('plinkoPlayBtn');
        const betInput = document.getElementById('plinkoBet');
        const plinkoBalanceEl = document.getElementById('plinkoBalance');

        let autoInterval = null;

        exitBtn.addEventListener('click', () => {
            if (animationId) cancelAnimationFrame(animationId);
            animationId = null;
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = null;
            balls = [];
            container.innerHTML = `<span style="color:#555;">Выберите раздел</span>`;
        });

        function setMode(mode) {
            if (mode === 'auto') {
                modeManual.classList.remove('active');
                modeAuto.classList.add('active');
                if (!autoInterval) {
                    autoInterval = setInterval(() => {
                        addBall();
                    }, 1500 + Math.random() * 500);
                }
            } else {
                modeAuto.classList.remove('active');
                modeManual.classList.add('active');
                if (autoInterval) {
                    clearInterval(autoInterval);
                    autoInterval = null;
                }
            }
        }

        modeManual.addEventListener('click', () => setMode('manual'));
        modeAuto.addEventListener('click', () => setMode('auto'));

        // ===== ИГРОВАЯ ЛОГИКА =====
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        let canvasW, canvasH;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvasW = rect.width;
            canvasH = rect.height;
            canvas.width = canvasW;
            canvas.height = canvasH;
            buildBoard();
            drawBoard();
        }
        window.addEventListener('resize', resizeCanvas);

        const rows = 16;
        let pegs = [];
        let slots = [];
        let balls = [];
        let animationId = null;
        const MULTIPLIERS = [10, 5, 2, 1, 0.5, 1, 2, 5, 10];

        function buildBoard() {
            pegs = [];
            slots = [];
            const numRows = rows;
            const slotCount = MULTIPLIERS.length;
            const spacingX = canvasW / (slotCount + 1);
            const spacingY = (canvasH - 40) / (numRows + 0.5);

            // Колышки (без верхнего ряда, чтобы шарики падали между)
            for (let row = 1; row < numRows; row++) {
                const cols = row + 1;
                const offsetX = (canvasW - (cols - 1) * spacingX) / 2;
                for (let col = 0; col < cols; col++) {
                    const x = offsetX + col * spacingX;
                    const y = 20 + row * spacingY;
                    pegs.push({ x, y, radius: 6 });
                }
            }

            const slotWidth = canvasW / slotCount;
            for (let i = 0; i < slotCount; i++) {
                const x = i * slotWidth + slotWidth / 2;
                const y = canvasH - 15;
                slots.push({
                    x: x,
                    y: y,
                    width: slotWidth * 0.7,
                    height: 16,
                    multiplier: MULTIPLIERS[i],
                    color: getSlotColor(MULTIPLIERS[i])
                });
            }
        }

        function getSlotColor(m) {
            if (m >= 5) return '#9b59b6';
            if (m >= 2) return '#34495e';
            return '#1a1a1a';
        }

        function drawBoard() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvasW, canvasH);
            // Фон чёрный
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvasW, canvasH);

            // Колышки – ярко-белые
            for (let p of pegs) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(255,255,255,0.6)';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#aaa';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Слоты (множители) – чётко видны
            for (let s of slots) {
                const x = s.x - s.width / 2;
                const y = s.y - s.height / 2;
                ctx.fillStyle = s.color;
                ctx.shadowBlur = 0;
                ctx.fillRect(x, y, s.width, s.height);
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, s.width, s.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('x' + s.multiplier, s.x, s.y);
            }

            // Шарики – красные с ярким свечением
            for (let b of balls) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
                ctx.fillStyle = '#ff1744';
                ctx.shadowColor = 'rgba(255,23,68,0.8)';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ff5252';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function addBall() {
            const bet = parseFloat(betInput.value);
            if (isNaN(bet) || bet <= 0) { alert('Введите корректную ставку'); return; }
            if (bet > balance) { alert('Недостаточно средств!'); return; }

            balance -= bet;
            updateBalanceUI();
            if (plinkoBalanceEl) plinkoBalanceEl.textContent = balance.toFixed(2);

            const startX = canvasW / 2 + (Math.random() - 0.5) * 8;
            const ball = {
                x: startX,
                y: 10,
                vx: (Math.random() - 0.5) * 0.3,
                vy: 0.5,
                radius: 7,
                bet: bet,
                finished: false
            };
            balls.push(ball);
            if (!animationId) {
                gameLoop();
            }
        }

        function gameLoop() {
            let anyActive = false;
            const GRAVITY = 0.25;
            const BOUNCE = 0.7; // высокий отскок для лучшего движения
            const FRICTION = 0.99;

            for (let b of balls) {
                if (b.finished) continue;
                anyActive = true;
                b.vy += GRAVITY;
                b.x += b.vx;
                b.y += b.vy;
                // небольшое трение
                b.vx *= FRICTION;
                b.vy *= FRICTION;

                // Столкновения с колышками
                for (let p of pegs) {
                    const dx = b.x - p.x;
                    const dy = b.y - p.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < b.radius + p.radius) {
                        const angle = Math.atan2(dy, dx);
                        const overlap = (b.radius + p.radius - dist) * 0.5;
                        b.x += Math.cos(angle) * overlap;
                        b.y += Math.sin(angle) * overlap;
                        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                        const newVx = Math.cos(angle) * speed * BOUNCE;
                        const newVy = Math.sin(angle) * speed * BOUNCE;
                        b.vx = newVx + (Math.random() - 0.5) * 0.4;
                        b.vy = newVy + (Math.random() - 0.5) * 0.4;
                        // Смещение для предотвращения застревания
                        b.x += (Math.random() - 0.5) * 1.0;
                        b.y += (Math.random() - 0.5) * 1.0;
                    }
                }

                // Стены
                if (b.x < b.radius) { b.x = b.radius; b.vx = -b.vx * 0.8; }
                if (b.x > canvasW - b.radius) { b.x = canvasW - b.radius; b.vx = -b.vx * 0.8; }

                // Попадание в слот – шарик удаляется, не застревает
                if (b.y + b.radius > canvasH - 10) {
                    let targetSlot = slots[0];
                    for (let s of slots) {
                        if (Math.abs(b.x - s.x) < Math.abs(b.x - targetSlot.x)) {
                            targetSlot = s;
                        }
                    }
                    const isWin = Math.random() < 0.36;
                    let finalMultiplier = isWin ? targetSlot.multiplier : 0;
                    let finalWin = isWin ? Math.round(b.bet * finalMultiplier * 100) / 100 : 0;
                    if (isWin) {
                        balance += finalWin;
                    }
                    updateBalanceUI();
                    if (plinkoBalanceEl) plinkoBalanceEl.textContent = balance.toFixed(2);
                    b.finished = true;
                    // Шарик удаляется из массива, не остаётся на месте
                }
            }

            // Удаляем завершённые шарики (чтобы они не мешали и не заслоняли множители)
            balls = balls.filter(b => !b.finished);

            drawBoard();

            if (anyActive || balls.length > 0) {
                animationId = requestAnimationFrame(gameLoop);
            } else {
                animationId = null;
            }
        }

        playBtn.addEventListener('click', addBall);

        setTimeout(() => {
            resizeCanvas();
        }, 50);

        // Обновление баланса в этом окне
        window.updateBalanceUI = function() {
            document.getElementById('balanceDisplay').textContent = balance;
            document.getElementById('panelBalance').textContent = balance;
            if (plinkoBalanceEl) plinkoBalanceEl.textContent = balance.toFixed(2);
        };
        window.openPanel = function() {
            balancePanel.classList.add('open');
            document.getElementById('panelBalance').textContent = balance;
            if (plinkoBalanceEl) plinkoBalanceEl.textContent = balance.toFixed(2);
        };

        // По умолчанию ручной
        setMode('manual');
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        const mainArea = document.getElementById('mainArea');
        mainArea.innerHTML = `<span style="color:#555;">Выберите раздел</span>`;
    });
</script>
</body>
</html>
