<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWIN BOL</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100%;
            height: 100vh;
            max-width: 480px;
            padding: 12px 16px;
            background: #111;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-radius: 0;
            border: none;
            position: relative;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .brand {
            background: #6a1b9a;
            padding: 4px 14px;
            border-radius: 12px;
            border: 2px solid #f5b342;
            box-shadow: 0 0 15px rgba(245, 179, 66, 0.2);
            font-size: 18px;
            font-weight: 900;
            color: #f5b342;
            letter-spacing: 1px;
            text-transform: uppercase;
            user-select: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .brand:hover {
            box-shadow: 0 0 25px rgba(245, 179, 66, 0.5);
        }
        .auth-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .auth-buttons button {
            background: transparent;
            border: 1px solid #555;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #eee;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .auth-buttons button:hover {
            border-color: #f5b342;
            color: #f5b342;
            box-shadow: 0 0 12px rgba(245,179,66,0.2);
        }
        .auth-buttons .login {
            border-color: #f5b342;
            color: #f5b342;
        }
        .auth-buttons .register {
            background: #f5b342;
            border-color: #f5b342;
            color: #111;
        }
        .auth-buttons .register:hover {
            background: #ffd54f;
            border-color: #ffd54f;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .balance-top {
            background: #1a1a1a;
            padding: 4px 14px 6px 14px;
            border-radius: 12px;
            border: 1px solid #444;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }
        .balance-top:hover {
            border-color: #f5b342;
            background: #222;
            box-shadow: 0 0 15px rgba(245, 179, 66, 0.15);
        }
        .balance-label {
            font-size: 10px;
            color: #f5b342;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.8;
            line-height: 1.2;
        }
        .balance-amount {
            font-size: 17px;
            font-weight: 700;
            color: #f5b342;
            line-height: 1.3;
        }
        .balance-amount span {
            color: #f5b342;
        }
        .burger {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            flex-shrink: 0;
        }
        .burger span {
            display: block;
            width: 22px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: 0.3s;
        }

        .body-row {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .sidebar {
            width: 85px;
            flex-shrink: 0;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 12px 6px;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.2s;
            overflow-y: auto;
        }
        .sidebar .menu-item {
            font-size: 12px;
            font-weight: 700;
            color: #ccc;
            padding: 10px 4px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.25s ease;
            text-align: center;
            letter-spacing: 0.3px;
            border: 2px solid transparent;
            background: #121212;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            text-transform: uppercase;
            line-height: 1.2;
            word-break: break-word;
        }
        .sidebar .menu-item[data-action="quick"] {
            border-color: #ff6f00;
            color: #ffab00;
        }
        .sidebar .menu-item[data-action="bonuses"] {
            border-color: #2e7d32;
            color: #66bb6a;
        }
        .sidebar .menu-item[data-action="vip"] {
            border-color: #6a1b9a;
            color: #ce93d8;
        }
        .sidebar .menu-item[data-action="promotions"] {
            border-color: #c62828;
            color: #ef5350;
        }
        .sidebar .menu-item:hover {
            border-color: #f5b342 !important;
            color: #f5b342 !important;
            background: #1e1e2a;
            box-shadow: 0 0 20px rgba(245, 179, 66, 0.3);
            transform: scale(1.02);
        }
        .sidebar .menu-item:active {
            transform: scale(0.95);
        }

        .main-area {
            flex: 1;
            background: #1a1a1a;
            border-radius: 20px;
            border: 1px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 18px;
            padding: 8px;
            min-height: 0;
            overflow: hidden;
            transition: 0.2s;
            position: relative;
        }
        .main-area canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 16px;
        }
        .main-area .plinko-ui {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Новый интерфейс Stake-style */
        .stake-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 8px;
            background: #1a1a1a;
            border-radius: 20px;
            overflow-y: auto;
        }
        .stake-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        .stake-logo {
            font-size: 18px;
            font-weight: 900;
            color: #f5b342;
            letter-spacing: 1px;
        }
        .stake-balance {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .stake-balance .amount {
            color: #f5b342;
        }
        .stake-balance .wallet-btn {
            background: #2a2a3a;
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .stake-tabs {
            display: flex;
            gap: 4px;
            background: #2a2a3a;
            border-radius: 30px;
            padding: 2px;
        }
        .stake-tabs button {
            background: transparent;
            border: none;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: 0.2s;
        }
        .stake-tabs button.active {
            background: #f5b342;
            color: #111;
        }
        .stake-row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }
        .stake-row .field {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f0f1a;
            border-radius: 30px;
            padding: 4px 12px;
            border: 1px solid #2a2a3a;
            flex: 1;
        }
        .stake-row .field label {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        .stake-row .field input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            width: 60px;
            outline: none;
            text-align: right;
        }
        .stake-row .field select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            padding: 4px 0;
        }
        .stake-row .field select option {
            background: #1a1a1a;
        }
        .stake-row .bet-btn {
            background: linear-gradient(145deg, #f5b342, #b8860b);
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 16px;
            color: #111;
            cursor: pointer;
            box-shadow: 0 4px 0 #5a3a1a;
            transition: 0.15s;
        }
        .stake-row .bet-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5a3a1a;
        }
        .stake-row .bet-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 0px 0 #5a3a1a;
            pointer-events: none;
        }
        .stake-failures {
            background: #0f0f1a;
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid #2a2a3a;
            max-height: 60px;
            overflow-y: auto;
            font-size: 12px;
            color: #aaa;
        }
        .stake-failures .failure-item {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px solid #222;
        }
        .stake-failures .failure-item .win {
            color: #4caf50;
        }
        .stake-failures .failure-item .lose {
            color: #f44336;
        }

        .game-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1f1f2a;
            border-radius: 24px;
            padding: 20px;
            border: 2px solid #444;
            transition: 0.25s;
            cursor: pointer;
            width: 120px;
            height: 120px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .game-icon:hover {
            border-color: #f5b342;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(245,179,66,0.2);
        }
        .game-icon .emoji {
            font-size: 48px;
        }
        .game-icon .label {
            font-size: 16px;
            font-weight: 600;
            color: #eee;
            margin-top: 8px;
        }

        .footer {
            text-align: center;
            color: #444;
            font-size: 11px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 300px;
            height: 100%;
            background: #1a1a1a;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
            padding: 60px 24px 24px;
            border-left: 1px solid #333;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .menu-overlay.open {
            transform: translateX(0);
        }
        .menu-item-burger {
            font-size: 20px;
            font-weight: 600;
            color: #eee;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: 0.15s;
        }
        .menu-item-burger:active {
            color: #f5b342;
            transform: translateX(6px);
        }
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .backdrop.active {
            display: block;
        }

        .balance-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 2px solid #f5b342;
            border-radius: 30px 30px 0 0;
            padding: 24px 20px 30px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 600;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
        }
        .balance-panel.open {
            transform: translateY(0);
        }
        .balance-panel .balance-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            color: #aaa;
        }
        .balance-panel .panel-balance-amount {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            color: #f5b342;
            margin-bottom: 24px;
        }
        .balance-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .balance-actions button {
            border: none;
            border-radius: 20px;
            padding: 16px 8px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .balance-actions button:active {
            transform: scale(0.94);
        }
        .btn-deposit {
            background: #2e7d32;
        }
        .btn-withdraw {
            background: #1565c0;
        }
        .btn-referral {
            background: #7b1fa2;
        }
        .btn-bonus {
            background: #4a2a5a;
            border: 1px solid #f5b342;
        }
        .btn-bonus .icon {
            font-size: 20px;
        }
        .panel-close {
            position: absolute;
            top: 12px;
            right: 20px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .panel-close:active { color: #fff; }

        @media (max-width: 480px) {
            .container { padding: 10px 12px; }
            .brand { font-size: 15px; padding: 2px 10px; }
            .auth-buttons button { font-size: 11px; padding: 3px 10px; }
            .balance-top { min-width: 60px; padding: 3px 10px 5px; }
            .balance-amount { font-size: 15px; }
            .balance-label { font-size: 9px; }
            .sidebar { width: 70px; padding: 8px 4px; gap: 8px; }
            .sidebar .menu-item { font-size: 10px; padding: 8px 2px; border-radius: 10px; }
            .main-area { padding: 4px; }
            .stake-container { padding: 8px; gap: 6px; }
            .stake-row { flex-wrap: wrap; }
            .stake-row .field { flex: 1 1 40%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-left">
            <div class="brand">TWIN BOL</div>
            <div class="auth-buttons">
                <button class="login" id="loginBtn">Вход</button>
                <button class="register" id="registerBtn">Регистрация</button>
            </div>
        </div>
        <div class="header-right">
            <div class="balance-top" id="balanceTop">
                <div class="balance-label">Ваш баланс</div>
                <div class="balance-amount">💰 <span id="balanceDisplay">1000</span></div>
            </div>
            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>

    <div class="body-row">
        <div class="sidebar" id="sidebar">
            <div class="menu-item" data-action="quick">Quick Games</div>
            <div class="menu-item" data-action="bonuses">Bonuses</div>
            <div class="menu-item" data-action="vip">VIP Club</div>
            <div class="menu-item" data-action="promotions">Promotions</div>
        </div>
        <div class="main-area" id="mainArea">
            <span style="color:#555;">Выберите раздел</span>
        </div>
    </div>

    <div class="footer">TWIN BOL — играй и выигрывай</div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="menu-overlay" id="menuOverlay">
    <div class="menu-item-burger" data-action="settings">⚙️ Настройки</div>
    <div class="menu-item-burger" data-action="history">📜 История</div>
    <div class="menu-item-burger" data-action="support">🆘 Поддержка</div>
    <div class="menu-item-burger" data-action="bonus">🎁 Бонуски</div>
</div>

<div class="balance-panel" id="balancePanel">
    <button class="panel-close" id="panelClose">✕</button>
    <div class="balance-title">Ваш баланс</div>
    <div class="panel-balance-amount" id="panelBalance">1000</div>
    <div class="balance-actions">
        <button class="btn-deposit">💰 Пополнение</button>
        <button class="btn-withdraw">💳 Вывод</button>
        <button class="btn-referral">👥 Реферальная программа %</button>
        <button class="btn-bonus"><span class="icon">🎁</span> Бонус</button>
    </div>
</div>

<script>
    let balance = 1000;
    function updateBalanceUI() {
        document.getElementById('balanceDisplay').textContent = balance;
        document.getElementById('panelBalance').textContent = balance;
    }
    updateBalanceUI();

    // Панель баланса
    const balancePanel = document.getElementById('balancePanel');
    const panelClose = document.getElementById('panelClose');
    function openPanel() {
        balancePanel.classList.add('open');
        document.getElementById('panelBalance').textContent = balance;
    }
    function closePanel() {
        balancePanel.classList.remove('open');
    }
    document.getElementById('balanceTop').addEventListener('click', (e) => {
        e.stopPropagation();
        if (balancePanel.classList.contains('open')) closePanel();
        else openPanel();
    });
    panelClose.addEventListener('click', closePanel);
    document.addEventListener('click', (e) => {
        if (balancePanel.classList.contains('open')) {
            const balanceTop = document.getElementById('balanceTop');
            if (!balancePanel.contains(e.target) && e.target !== balanceTop && !balanceTop.contains(e.target)) {
                closePanel();
            }
        }
    });
    document.querySelectorAll('.balance-actions button').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            alert(`Вы выбрали: ${this.innerText.trim()}`);
            closePanel();
        });
    });

    // Меню-бургер
    const burgerBtn = document.getElementById('burgerBtn');
    const menuOverlay = document.getElementById('menuOverlay');
    const backdrop = document.getElementById('backdrop');
    function openMenu() {
        menuOverlay.classList.add('open');
        backdrop.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeMenu() {
        menuOverlay.classList.remove('open');
        backdrop.classList.remove('active');
        document.body.style.overflow = '';
    }
    burgerBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (menuOverlay.classList.contains('open')) closeMenu();
        else openMenu();
    });
    backdrop.addEventListener('click', closeMenu);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    document.querySelectorAll('.menu-item-burger').forEach(item => {
        item.addEventListener('click', () => {
            alert(`Вы выбрали: ${this.textContent.trim()}`);
            closeMenu();
        });
    });
    document.getElementById('loginBtn').addEventListener('click', () => alert('Форма входа (скоро)'));
    document.getElementById('registerBtn').addEventListener('click', () => alert('Форма регистрации (скоро)'));

    // Обработчики бокового меню
    document.querySelectorAll('.sidebar .menu-item').forEach(item => {
        item.addEventListener('click', function() {
            const action = this.dataset.action;
            const mainArea = document.getElementById('mainArea');
            switch(action) {
                case 'quick':
                    mainArea.innerHTML = `
                        <div class="game-icon" id="plinkoIcon">
                            <div class="emoji">🟡</div>
                            <div class="label">Plinko</div>
                        </div>
                    `;
                    document.getElementById('plinkoIcon').addEventListener('click', function() {
                        startPlinkoGame(mainArea);
                    });
                    break;
                case 'bonuses':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">🎁 Бонусы – скоро</span>`;
                    break;
                case 'vip':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">👑 VIP клуб – скоро</span>`;
                    break;
                case 'promotions':
                    mainArea.innerHTML = `<span style="font-size:22px; font-weight:600; color:#f5b342;">🔥 Акции – скоро</span>`;
                    break;
                default:
                    mainArea.innerHTML = `<span style="color:#555;">Выберите раздел</span>`;
            }
        });
    });

    // ============================================================
    //  PLINKO – НОВЫЙ ИНТЕРФЕЙС В СТИЛЕ STAKE
    // ============================================================
    function startPlinkoGame(container) {
        container.innerHTML = `
            <div class="stake-container">
                <div class="stake-header">
                    <div class="stake-logo">TWIN BOL</div>
                    <div class="stake-balance">
                        <span class="amount">$<span id="plinkoBalance">${balance}</span></span>
                        <button class="wallet-btn" id="walletBtn">Wallet</button>
                    </div>
                </div>
                <div class="stake-tabs">
                    <button class="active" id="manualTab">Manual</button>
                    <button id="autoTab">Auto</button>
                </div>
                <div class="stake-row">
                    <div class="field">
                        <label>Bit Amount</label>
                        <input type="number" id="bitAmount" value="10" min="1">
                    </div>
                    <div class="field">
                        <label>Risk</label>
                        <select id="riskSelect">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="stake-row">
                    <div class="field">
                        <label>Rows</label>
                        <input type="number" id="rowsInput" value="16" min="8" max="20">
                    </div>
                    <button class="bet-btn" id="betBtn">Bet</button>
                </div>
                <div class="stake-failures" id="failuresList">
                    <div style="text-align:center; color:#666;">Failures</div>
                </div>
                <canvas id="plinkoCanvas" style="width:100%; height:150px; border-radius:12px; background:#0f0f1a;"></canvas>
            </div>
        `;

        // Переназначение кнопок и полей
        const betBtn = document.getElementById('betBtn');
        const bitInput = document.getElementById('bitAmount');
        const rowsInput = document.getElementById('rowsInput');
        const riskSelect = document.getElementById('riskSelect');
        const failuresList = document.getElementById('failuresList');
        const plinkoBalance = document.getElementById('plinkoBalance');
        const walletBtn = document.getElementById('walletBtn');
        const manualTab = document.getElementById('manualTab');
        const autoTab = document.getElementById('autoTab');

        // Обновление баланса в Plinko при изменении
        function updatePlinkoBalance() {
            if (plinkoBalance) plinkoBalance.textContent = balance;
        }
        updatePlinkoBalance();

        // Wallet button – открывает панель баланса
        walletBtn.addEventListener('click', () => openPanel());

        // Tabs – просто переключение
        manualTab.addEventListener('click', () => {
            manualTab.classList.add('active');
            autoTab.classList.remove('active');
        });
        autoTab.addEventListener('click', () => {
            autoTab.classList.add('active');
            manualTab.classList.remove('active');
        });

        // Инициализация холста
        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        let canvasW, canvasH;
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = Math.min(rect.width - 16, 400);
            const h = 150;
            canvas.width = w;
            canvas.height = h;
            canvasW = canvas.width;
            canvasH = canvas.height;
            buildBoard();
            drawBoard();
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Переменные для игры
        let pegs = [];
        let slots = [];
        let ball = null;
        let animationId = null;
        let isDropping = false;
        let betAmount = 10;
        let rows = 16;
        let risk = 'medium';
        let failures = [];

        // Множители в зависимости от риска и рядов (упрощённо)
        function getMultipliers(rows, risk) {
            // Для демонстрации используем фиксированные мультипликаторы
            // В реальном Stake они зависят от rows и risk
            if (rows >= 16) {
                if (risk === 'low') return [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10, 12, 14, 16, 18, 20, 22];
                if (risk === 'medium') return [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 18, 22, 26, 30, 35, 40];
                return [1, 3, 5, 7, 9, 12, 15, 20, 25, 30, 40, 50, 60, 70, 80, 90];
            }
            // Меньше рядов – другие множители (заглушка)
            return [1, 2, 3, 4, 5, 6, 8, 10];
        }

        function buildBoard() {
            pegs = [];
            slots = [];
            const numRows = parseInt(rowsInput ? rowsInput.value : 16);
            const totalRows = Math.min(Math.max(numRows, 8), 20);
            const spacingX = canvasW / (totalRows + 1.5);
            const spacingY = (canvasH - 40) / (totalRows + 0.5);
            const startX = spacingX * 0.8;

            for (let row = 0; row < totalRows; row++) {
                const cols = row + 1;
                const offsetX = (canvasW - (cols - 1) * spacingX) / 2;
                for (let col = 0; col < cols; col++) {
                    const x = offsetX + col * spacingX;
                    const y = 20 + row * spacingY;
                    pegs.push({ x, y, radius: 4 });
                }
            }

            const multi = getMultipliers(totalRows, risk);
            const slotCount = Math.min(multi.length, 10);
            const slotWidth = canvasW / slotCount;
            for (let i = 0; i < slotCount; i++) {
                const x = i * slotWidth + slotWidth / 2;
                const y = canvasH - 15;
                slots.push({
                    x: x,
                    y: y,
                    width: slotWidth * 0.7,
                    height: 12,
                    multiplier: multi[i] || 1,
                    color: getMultiplierColor(multi[i] || 1)
                });
            }
        }

        function getMultiplierColor(m) {
            if (m >= 20) return '#ef5350';
            if (m >= 10) return '#ff7043';
            if (m >= 5) return '#ffa726';
            if (m >= 2) return '#66bb6a';
            return '#42a5f5';
        }

        function drawBoard() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvasW, canvasH);
            ctx.fillStyle = '#0f0f1a';
            ctx.fillRect(0, 0, canvasW, canvasH);

            for (let p of pegs) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#555';
                ctx.fill();
            }

            for (let s of slots) {
                const x = s.x - s.width / 2;
                const y = s.y - s.height / 2;
                ctx.fillStyle = s.color;
                ctx.shadowColor = 'rgba(255,255,255,0.1)';
                ctx.shadowBlur = 6;
                ctx.fillRect(x, y, s.width, s.height);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('x' + s.multiplier, s.x, s.y);
            }

            if (ball) {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#f5b342';
                ctx.shadowColor = 'rgba(245,179,66,0.6)';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function dropBall() {
            if (isDropping) return;
            const bet = parseInt(bitInput ? bitInput.value : 10);
            if (isNaN(bet) || bet < 1) { alert('Введите ставку'); return; }
            if (bet > balance) { alert('Недостаточно средств!'); return; }

            balance -= bet;
            betAmount = bet;
            updateBalanceUI();
            updatePlinkoBalance();

            const startX = canvasW / 2 + (Math.random() - 0.5) * 20;
            ball = {
                x: startX,
                y: 10,
                vx: (Math.random() - 0.5) * 0.3,
                vy: 0.5,
                radius: 6
            };
            isDropping = true;
            betBtn.disabled = true;
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function gameLoop() {
            if (!ball || !isDropping) {
                drawBoard();
                return;
            }

            const GRAVITY = 0.2;
            const BOUNCE = 0.5;
            ball.vy += GRAVITY;
            ball.x += ball.vx;
            ball.y += ball.vy;

            for (let p of pegs) {
                const dx = ball.x - p.x;
                const dy = ball.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < ball.radius + p.radius) {
                    const angle = Math.atan2(dy, dx);
                    const overlap = (ball.radius + p.radius - dist) * 0.5;
                    ball.x += Math.cos(angle) * overlap;
                    ball.y += Math.sin(angle) * overlap;
                    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    const newVx = Math.cos(angle) * speed * BOUNCE;
                    const newVy = Math.sin(angle) * speed * BOUNCE;
                    ball.vx = newVx + (Math.random() - 0.5) * 0.2;
                    ball.vy = newVy + (Math.random() - 0.5) * 0.2;
                }
            }

            if (ball.x < ball.radius) { ball.x = ball.radius; ball.vx = -ball.vx * 0.8; }
            if (ball.x > canvasW - ball.radius) { ball.x = canvasW - ball.radius; ball.vx = -ball.vx * 0.8; }

            if (ball.y + ball.radius > canvasH - 10) {
                let targetSlot = slots[0];
                for (let s of slots) {
                    if (Math.abs(ball.x - s.x) < Math.abs(ball.x - targetSlot.x)) {
                        targetSlot = s;
                    }
                }
                const isWin = Math.random() < 0.42;
                let finalMultiplier = isWin ? targetSlot.multiplier : 0;
                let finalWin = isWin ? Math.floor(betAmount * finalMultiplier) : 0;
                if (isWin) {
                    balance += finalWin;
                    document.getElementById('resultDisplay').textContent = '🎉 Выигрыш! x' + finalMultiplier + ' +' + finalWin;
                    document.getElementById('resultDisplay').style.color = '#4caf50';
                } else {
                    document.getElementById('resultDisplay').textContent = '😞 Проигрыш -' + betAmount;
                    document.getElementById('resultDisplay').style.color = '#f44336';
                }
                updateBalanceUI();
                updatePlinkoBalance();
                isDropping = false;
                ball = null;
                betBtn.disabled = false;
                drawBoard();
                return;
            }

            drawBoard();
            animationId = requestAnimationFrame(gameLoop);
        }

        // Обработчики
        betBtn.addEventListener('click', dropBall);

        // Обновление рядов при изменении
        rowsInput.addEventListener('change', function() {
            rows = parseInt(this.value) || 16;
            if (rows < 8) rows = 8;
            if (rows > 20) rows = 20;
            this.value = rows;
            buildBoard();
            drawBoard();
        });

        riskSelect.addEventListener('change', function() {
            risk = this.value;
            buildBoard();
            drawBoard();
        });

        // Инициализация
        buildBoard();
        drawBoard();

        // Добавим блок для результатов (можно вставить в failures)
        const resultDiv = document.createElement('div');
        resultDiv.id = 'resultDisplay';
        resultDiv.style.cssText = 'text-align:center; font-size:16px; font-weight:600; color:#f5b342; min-height:24px;';
        document.querySelector('.stake-failures').appendChild(resultDiv);

        // Добавим обработчик для закрытия панели баланса при клике вне
        // уже есть глобальный

        // При изменении баланса в главном окне обновляем Plinko
        // уже есть функция updatePlinkoBalance
    }

    // Переопределим updateBalanceUI чтобы обновлять Plinko
    const origUpdate = updateBalanceUI;
    updateBalanceUI = function() {
        origUpdate();
        // Если открыт Plinko, обновить его баланс
        const plinkoBal = document.getElementById('plinkoBalance');
        if (plinkoBal) plinkoBal.textContent = balance;
    };
    // Также нужно обновлять при вызове из других мест
    window.updateBalanceUI = updateBalanceUI;

    // Переопределим openPanel, чтобы при открытии панели баланса, если Plinko открыт, тоже обновлялось
    const origOpenPanel = openPanel;
    openPanel = function() {
        origOpenPanel();
        const plinkoBal = document.getElementById('plinkoBalance');
        if (plinkoBal) plinkoBal.textContent = balance;
    };
    window.openPanel = openPanel;

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('mainArea').innerHTML = `<span style="color:#555;">Выберите раздел</span>`;
    });
</script>
</body>
</html>
